# 담당자들이 각자 branch 로 작업하고 여기로 push 한다. 병합한 뒤에 깨진 것을
# 발견하면 어느 branch 탓인지 찾기 어려우므로, 올라온 시점에 자동으로 확인한다.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # 운영 배포와 같은 조합으로 돌린다. MySQL·BFF 경로도 테스트가 지난다.
          pip install -r requirements-dev.txt -r requirements-mysql.txt -r requirements-bff.txt

      - name: 대메뉴 등록 파일 검사
        run: python scripts/check_module_contract.py

      - name: 테스트
        run: python -m pytest -q

      - name: MySQL 스키마 적용 확인
        # SQLite 로만 돌리면 MySQL 전용 스키마의 문법 오류를 놓친다.
        run: python scripts/check_module_contract.py --mysql-schema
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: portal_ci
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: portal_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
