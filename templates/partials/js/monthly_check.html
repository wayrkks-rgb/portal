{# 월간 점검 스크립트 #}
<script>
let monthlyTab = 'server';

function switchMonthlyTab(name, tab) {
  ['key_resource','integrated','server','eosl'].forEach(n =>
    document.getElementById(`monthly-panel-${n}`).classList.remove('active'));
  tab.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById(`monthly-panel-${name}`).classList.add('active');
  monthlyTab = name;
}

// 증감은 양식처럼 숫자 뒤에 (+8) · (-2) 로 붙인다. 0 은 붙이지 않는다.
function deltaText(value) {
  const number = Number(value || 0);
  if (!number) return '';
  const sign = number > 0 ? '+' : '';
  const cls = number > 0 ? 'text-success' : 'text-error';
  return ` <span class="${cls}" style="font-size:11px">(${sign}${number})</span>`;
}

// 증감 숫자를 누르면 그 칸의 신규·삭제 서버가 하나씩 보인다. "8대 늘었다" 만
// 보고는 그걸 자산에서 빼야 할지 둬야 할지 판단할 수 없다.
function deltaLink(value, filter, label) {
  const number = Number(value || 0);
  if (!number) return '';
  const sign = number > 0 ? '+' : '';
  const cls = number > 0 ? 'text-success' : 'text-error';
  // 늘어난 칸은 신규를, 줄어든 칸은 삭제된 것을 본다.
  const change = number > 0 ? 'created' : 'removed';
  const args = JSON.stringify(Object.assign({change}, filter || {})).replace(/"/g, '&quot;');
  const title = `${label} ${change === 'created' ? '신규' : '삭제'}`;
  return ` <a href="javascript:void(0)" class="${cls}" style="font-size:11px"`
    + ` title="눌러서 어느 서버인지 보기"`
    + ` onclick="openMovementBrowser('${change}',${args},'${title}')">(${sign}${number})</a>`;
}

function renderStatusTable(elementId, table, delta, unitLabel) {
  const element = document.getElementById(elementId);
  if (!element) return;
  const columns = table.columns;
  // 양식의 머리글: UNIX(HP·IBM) / X86(Linux·Windows) / 기타 / 소계
  const groups = [['UNIX', ['HP','IBM']], ['X86', ['Linux','Windows']]];
  const flat = [];
  groups.forEach(([label, members]) => members.forEach(m => flat.push([label, m])));
  columns.filter(c => !flat.some(([, m]) => m === c)).forEach(c => flat.push(['', c]));

  const top = flat.map(([label], index, all) => {
    if (!label) return `<th rowspan="2">${syncEscape(flat[index][1] === '소계' ? unitLabel : flat[index][1])}</th>`;
    return all.findIndex(([l]) => l === label) === index
      ? `<th colspan="${all.filter(([l]) => l === label).length}">${syncEscape(label)}</th>` : '';
  }).join('');
  const second = flat.filter(([label]) => label).map(([, m]) => `<th>${syncEscape(m)}</th>`).join('');

  // 숫자를 누르면 그 숫자를 이루는 자산이 하나씩 보인다. 대수가 맞는지 따지려면
  // 숫자만으로는 안 된다.
  const kind = elementId.includes('physical') ? 'physical' : '';
  const rows = ['IDC','DR','계'].map(name => {
    const values = table.rows[name] || {};
    const cells = flat.map(([, column]) => {
      const count = Number(values[column] || 0);
      const text = count.toLocaleString();
      const cell_filter = {
        location: name === '계' ? '' : name,
        os_group: column === '소계' ? '' : column,
        kind,
      };
      const change = delta && delta[name]
        ? deltaLink(delta[name][column], cell_filter, `${name} · ${column}`)
        : '';
      const strong = column === '소계' || name === '계';
      const filter = JSON.stringify({
        location: name === '계' ? '' : name,
        os_group: column === '소계' ? '' : column,
        kind, state: 'included',
      }).replace(/"/g, '&quot;');
      const label = `${name} · ${column} ${text}대`;
      const inner = strong ? `<strong>${text}</strong>` : text;
      const cell = count
        ? `<a href="javascript:void(0)" onclick="openAssetBrowser(${filter},'${label}')">${inner}</a>`
        : inner;
      return `<td>${cell}${change}</td>`;
    }).join('');
    return `<tr><td><strong>${name}</strong></td>${cells}</tr>`;
  }).join('');

  element.innerHTML = `<thead><tr><th rowspan="2">구분</th>${top}</tr><tr>${second}</tr></thead><tbody>${rows}</tbody>`;
}

// 양식의 문구 그대로: IDC : 논리서버 12대 (Linux 7대, 기타 2대) , 물리서버 16대 (...)
function movementText(breakdown) {
  const lines = [];
  ['IDC','DR'].forEach(location => {
    const area = breakdown.locations[location];
    if (!area || !area.total) return;
    const parts = ['논리서버','물리서버'].map(kind => {
      const item = area.kinds[kind];
      if (!item || !item.total) return '';
      const detail = Object.entries(item.os).filter(([, n]) => n)
        .map(([name, n]) => `${syncEscape(name)} ${n}대`).join(', ');
      return `${kind} ${item.total}대${detail ? ` (${detail})` : ''}`;
    }).filter(Boolean);
    lines.push(`<div style="margin-left:18px">${location} : ${parts.join(' , ')}</div>`);
  });
  return lines.join('');
}

function renderMovements(movements) {
  const element = document.getElementById('monthly-movements');
  if (!element) return;
  if (!movements) {
    element.innerHTML = '<div class="text-muted">비교할 전월 스냅샷이 없습니다.</div>';
    return;
  }
  const blocks = [['created','자산 신규 생성'], ['removed','자산 삭제']].map(([key, label]) => {
    const data = movements[key];
    const idc = data.locations.IDC.total, dr = data.locations.DR.total;
    return `<div style="margin-bottom:12px">
      <div><strong>- ${label} ${data.total}대</strong> ( IDC ${idc}대 / DR ${dr}대 )</div>
      ${movementText(data)}</div>`;
  }).join('');
  element.innerHTML = blocks;
}

// ── 변동 내역: 어느 서버가 늘고 빠졌나 ─────────────────────────────────
// 대수만 보면 "8대 늘었다" 는 알아도 어느 서버인지 모른다. 그러면 그걸 자산에서
// 빼야 하는지 둬야 하는지 판단할 수 없다. 한 줄씩 적는다.
let monthlyMovements = null;

function renderMovementItems() {
  const table = document.getElementById('monthly-movement-items');
  if (!table) return;
  if (!monthlyMovements) {
    table.innerHTML = '';
    return;
  }
  const term = ((document.getElementById('monthly-movement-search') || {}).value || '')
    .trim().toLowerCase();
  const rows = [];
  [['created', '신규', 'text-success'], ['removed', '삭제', 'text-error']].forEach(([key, label, cls]) => {
    (monthlyMovements[key] || {}).items?.forEach(item => rows.push({...item, _label: label, _cls: cls, _key: key}));
  });
  const shown = term ? rows.filter(item => [
    item.hostname, item.primary_ip, item.service_name, item.cm_id,
    item.os_family, item.os_group, item.service_name,
  ].some(v => String(v || '').toLowerCase().includes(term))) : rows;

  table.className = 'table-sticky';
  table.innerHTML = `<thead><tr>
    <th>구분</th><th>자산번호</th><th>호스트명</th><th>IP</th><th>업무명</th>
    <th>위치</th><th>물리/논리</th><th>OS</th><th>EOSL</th><th>상태</th><th></th>
  </tr></thead><tbody>${
    shown.length ? shown.map(item => `<tr>
      <td><span class="${item._cls}"><strong>${item._label}</strong></span></td>
      <td class="text-xs mono">${syncEscape(item.cm_id || '-')}</td>
      <td><strong>${syncEscape(item.hostname || '(호스트명 없음)')}</strong></td>
      <td class="text-xs mono">${syncEscape(item.primary_ip || '-')}</td>
      <td>${syncEscape(item.service_name || '-')}</td>
      <td>${syncEscape(item.location || '-')}</td>
      <td>${syncEscape(item.kind || '-')}</td>
      <td>${syncEscape(item.os_group || '-')}
        ${item.os_version ? `<div class="text-xs text-muted">${syncEscape(item.os_family || '')} ${syncEscape(item.os_version)}</div>` : ''}</td>
      <td>${item.eosl_year == null ? '<span class="text-muted">미사용</span>' : syncEscape(String(item.eosl_year))}</td>
      <td class="text-xs">${syncEscape(item.status_label || item.status_code || '-')}</td>
      <td>${item._key === 'created'
        ? `<button class="btn btn-secondary btn-sm" onclick="excludeOneAsset('${syncEscape(item.cm_id)}','${syncEscape(item.hostname || '')}')">제외</button>`
        : ''}</td>
    </tr>`).join('')
      : `<tr><td colspan="11" style="text-align:center" class="text-muted">${
        rows.length ? '검색 결과가 없습니다.' : '이 달에 늘거나 빠진 자산이 없습니다.'
      }</td></tr>`
  }</tbody>`;

  const shownEl = document.getElementById('monthly-movement-shown');
  if (shownEl) {
    shownEl.textContent = rows.length
      ? `${shown.length.toLocaleString()} / ${rows.length.toLocaleString()}건 표시`
      : '';
  }
}

// 증감 숫자를 눌렀을 때 그 칸의 신규·삭제 서버만 본다. 목록 팝업에는 검색·엑셀·
// 일괄 제외가 이미 있으므로 그걸 그대로 쓴다.
function openMovementBrowser(change, extra, title) {
  const label = change === 'created' ? '신규 자산' : '삭제된 자산';
  openAssetBrowser(
    Object.assign({change, state: 'included'}, extra || {}),
    title || label
  );
}

// 한 건만 바로 뺀다. 목록에서 "이건 자산이 아니다" 가 분명할 때 쓴다.
// 여러 건이면 [전체 보기] 팝업에서 골라 한꺼번에 처리하는 쪽이 빠르다.
async function excludeOneAsset(cmId, hostname) {
  const reason = prompt(`[${hostname || cmId}] 을 자산에서 뺍니다. 사유를 적어주세요.`, '실물 서버 아님');
  if (reason === null) return;
  const alertEl = document.getElementById('monthly-alert');
  const response = await fetch('/api/asset-sync/admin/asset-exclusions', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      source: 'ITSM', mode: 'EXCLUDE', reason,
      items: [{asset_key: cmId, hostname}],
    }),
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.success) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(result.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  alertEl.innerHTML = `<div class="alert alert-success">✅ ${syncEscape(hostname || cmId)} 을 자산에서 뺐습니다.`
    + ' 모든 화면에 함께 적용됩니다. 다시 집계합니다.</div>';
  // 대수가 바뀌었으므로 열려 있는 화면을 다시 센다.
  if (typeof refreshCountsAfterScopeChange === 'function') refreshCountsAfterScopeChange();
  else loadMonthlyCheck();
}

// ── 대수 맞춤 ───────────────────────────────────────────────────────────
// "대수가 안 맞는다" 에는 두 가지가 섞여 있다. 같아야 하는데 다른 것(버그)과
// 달라야 정상인 것(ITSM 자산 vs vCenter VM). 표만 보면 가릴 수 없으므로
// 같아야 하는 쌍을 직접 견주고, 달라도 되는 것은 이유를 적는다.
const AUDIT_MARK = {OK: '✅', MISMATCH: '❌', STALE: '⚠️', INFO: 'ℹ️'};
const AUDIT_CLASS = {OK: 'text-success', MISMATCH: 'text-error', STALE: 'text-warning', INFO: 'text-muted'};

function toggleCountAudit() {
  const detail = document.getElementById('monthly-audit-detail');
  const button = document.getElementById('monthly-audit-toggle');
  if (!detail) return;
  detail.hidden = !detail.hidden;
  if (button) button.textContent = detail.hidden ? '자세히' : '접기';
}

function renderCountAudit(audit) {
  const verdictEl = document.getElementById('monthly-audit-verdict');
  if (!verdictEl) return;
  const checks = audit.checks || [];
  const bad = checks.filter(c => c.verdict === 'MISMATCH');
  const stale = checks.filter(c => c.verdict === 'STALE');

  if (bad.length) {
    verdictEl.innerHTML = `<div class="alert alert-error">❌ 같아야 하는 대수가 다릅니다.
      ${bad.map(c => `<div class="text-xs">· ${syncEscape(c.message)}</div>`).join('')}</div>`;
  } else if (stale.length) {
    verdictEl.innerHTML = `<div class="alert alert-warning">⚠️ 대수 자체는 서로 맞습니다.
      다만 자료 시점이 어긋나 화면 사이의 숫자가 다를 수 있습니다.
      ${stale.map(c => `<div class="text-xs">· ${syncEscape(c.message)}</div>`).join('')}</div>`;
  } else {
    verdictEl.innerHTML = '<div class="alert alert-success">✅ 같아야 하는 대수가 모두 맞습니다.</div>';
  }

  const table = document.getElementById('monthly-audit-table');
  if (table) {
    table.innerHTML = `<thead><tr><th>검사</th><th>결과</th><th>내용</th></tr></thead><tbody>${
      checks.map(c => `<tr>
        <td><strong>${syncEscape(c.name)}</strong></td>
        <td class="${AUDIT_CLASS[c.verdict] || ''}">${AUDIT_MARK[c.verdict] || ''} ${syncEscape(c.verdict)}</td>
        <td class="text-xs">${syncEscape(c.message)}</td>
      </tr>`).join('') || '<tr><td colspan="3" style="text-align:center" class="text-muted">검사할 자료가 없습니다.</td></tr>'
    }</tbody>`;
  }

  const sources = document.getElementById('monthly-audit-sources');
  if (sources) {
    const counts = audit.counts || {}, src = audit.sources || {};
    const itsm = counts.itsm || {}, vcenter = counts.vcenter || {}, usage = counts.resource_usage || {};
    const when = info => info ? `${info.snapshot_date}${info.collected_at ? ` (${String(info.collected_at).slice(0, 16).replace('T', ' ')})` : ''}` : '없음';
    const rows = [
      ['ITSM 스냅샷 전체', itsm.loaded, when(src.itsm)],
      ['└ 자산으로 세는 것', itsm.selected, '서버현황·EOSL·대시보드가 쓰는 수'],
      ['└ 제외', itsm.excluded, '상태·빈 값·수동 제외'],
      ['└ 물리서버', itsm.physical, '서버현황(물리) · EOSL 서버 행'],
      ['vCenter 스냅샷 전체 VM', vcenter.loaded, when(src.vcenter)],
      ['└ 세는 VM', vcenter.selected, 'vCLS 등 제외 후'],
      ['통합기(ESXi) 줄 수', usage.host_rows,
        src.resource_usage ? `자원사용률 ${src.resource_usage.period_end} 기준` : '수집 없음'],
      ['└ 통합기 표 VM 합', usage.host_vm_total, '통합서버 자원사용현황 표의 합'],
      ['└ VM 목록 줄 수', usage.vm_rows, '같아야 한다'],
      ['데이터스토어', usage.datastore_rows, ''],
    ];
    sources.innerHTML = `<thead><tr><th>항목</th><th>대수</th><th>출처 · 기준</th></tr></thead><tbody>${
      rows.map(([label, value, note]) => `<tr>
        <td>${syncEscape(label)}</td>
        <td><strong>${value == null ? '-' : Number(value).toLocaleString()}</strong></td>
        <td class="text-xs text-muted">${syncEscape(note)}</td>
      </tr>`).join('')
    }</tbody>`;
  }

  const basis = document.getElementById('monthly-audit-basis');
  if (basis) {
    const mark = AUDIT_MARK[audit.verdict] || '';
    basis.textContent = `${audit.base_day} 기준 ${mark}`;
  }
}

async function loadCountAudit(month) {
  if (!document.getElementById('monthly-audit-verdict')) return;
  try {
    renderCountAudit(await apiFetch('/api/asset-sync/count-audit' + (month ? `?month=${month}` : '')));
  } catch (error) {
    document.getElementById('monthly-audit-verdict').innerHTML =
      `<div class="alert alert-error">❌ 대수 맞춤 실패: ${syncEscape(error.message)}</div>`;
  }
}

function renderEosl(eosl) {
  const element = document.getElementById('monthly-eosl');
  if (!element) return;
  const columns = eosl.columns;
  const head = `<thead><tr><th rowspan="2">구분</th><th rowspan="2">전체 수량</th>
    <th colspan="${columns.length - 1}">EOSL 일자</th><th rowspan="2">비고</th></tr>
    <tr>${columns.slice(0, -1).map(c => `<th>${syncEscape(c)}</th>`).join('')}</tr></thead>`;
  // 숫자를 누르면 그 연도에 걸린 자산이 하나씩 보인다. "2028년 이상 15대" 만
  // 보고는 어느 장비인지 알 수 없다.
  const rows = ['physical','all'].map(key => {
    const row = eosl[key];
    const kind = key === 'physical' ? 'physical' : '';
    // 전월 대비 증감. 서버현황만 증감이 보이고 EOSL 은 안 보이면, 늘어난 서버가
    // 어느 연도에 걸렸는지 알 수 없다.
    const delta = (eosl.delta || {})[key] || {};
    const cells = columns.slice(0, -1).map(c => {
      const count = Number(row.counts[c] || 0);
      const text = count.toLocaleString();
      const change = deltaLink(delta[c], {eosl: c, kind}, `EOSL ${c} · ${row.label}`);
      if (!count) return `<td>${text}${change}</td>`;
      const filter = JSON.stringify({eosl: c, kind, state: 'included'}).replace(/"/g, '&quot;');
      return `<td><a href="javascript:void(0)" onclick="openAssetBrowser(${filter},'EOSL ${syncEscape(c)} · ${syncEscape(row.label)} ${text}대')">${text}</a>${change}</td>`;
    }).join('');
    const unused = Number(row.counts['미사용'] || 0);
    const totalFilter = JSON.stringify({kind, state: 'included'}).replace(/"/g, '&quot;');
    const totalChange = deltaLink(delta['전체'], {kind}, `${row.label} 전체`);
    return `<tr><td><strong>${syncEscape(row.label)}</strong></td>
      <td><strong><a href="javascript:void(0)" onclick="openAssetBrowser(${totalFilter},'${syncEscape(row.label)} 전체')">${Number(row.total).toLocaleString()}</a></strong>${totalChange}</td>${cells}
      <td>${unused ? `미사용 ${unused}대` : ''}</td></tr>`;
  }).join('');
  element.innerHTML = head + `<tbody>${rows}</tbody>`;
  document.getElementById('monthly-eosl-basis').textContent =
    `${eosl.criteria.eosl_field} 기준 · ${eosl.criteria.base_year}년 기준 · ${eosl.criteria.no_plan_year} = 계획 없음`;
  renderEoslDiagnosis(eosl.diagnosis || {}, eosl.criteria || {});
}

// 표가 온통 '계획 없음' 이거나 '미사용' 이면, 그게 실제 데이터인지 컬럼을 잘못
// 짚은 것인지 표만 봐서는 알 수 없다. 어디서 읽었고 원래 값이 어떻게 생겼는지
// 같이 보여준다.
function renderEoslDiagnosis(diagnosis, criteria) {
  const holder = document.getElementById('monthly-eosl-diagnosis');
  if (!holder) return;
  const byField = diagnosis.by_field || {};
  const entries = Object.entries(byField).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { holder.innerHTML = ''; return; }

  const missing = Number(byField['(값 없음)'] || 0);
  const total = entries.reduce((sum, [, n]) => sum + Number(n || 0), 0);
  const unreadable = diagnosis.unreadable_samples || [];

  const lines = entries.map(([name, count]) => {
    const samples = (diagnosis.samples || {})[name] || [];
    return `<div>· <strong>${syncEscape(name)}</strong> ${Number(count).toLocaleString()}건`
      + (samples.length ? ` <span class="text-muted mono">예: ${syncEscape(samples.join(', '))}</span>` : '')
      + '</div>';
  }).join('');

  let verdict = '';
  if (missing === total) {
    verdict = `<div class="alert alert-error" style="margin-bottom:8px">❌ EOSL 값을 한 건도 읽지 못했습니다.
      찾아본 컬럼: <span class="mono">${syncEscape((diagnosis.checked_fields || []).join(', '))}</span>.
      ITSM 조회 SQL 에 EOSL 컬럼이 빠졌거나 이름이 다릅니다.</div>`;
  } else if (missing > total / 2) {
    verdict = `<div class="alert alert-warning" style="margin-bottom:8px">⚠️ 절반 이상(${missing.toLocaleString()}건)이 EOSL 값 없이 들어옵니다.</div>`;
  } else if (unreadable.length) {
    verdict = `<div class="alert alert-warning" style="margin-bottom:8px">⚠️ 값은 있는데 연도를 못 읽은 것이 있습니다:
      <span class="mono">${syncEscape(unreadable.join(', '))}</span></div>`;
  }
  holder.innerHTML = verdict + `<div class="text-xs text-muted">EOSL 값 출처${lines}</div>`;
}

function monthRange(month) {
  const now = new Date();
  const [year, index] = month
    ? month.split('-').map(Number)
    : [now.getFullYear(), now.getMonth() + 1];
  const pad = n => String(n).padStart(2, '0');
  const last = new Date(year, index, 0);        // 다음 달 0일 = 이번 달 말일
  const isThisMonth = year === now.getFullYear() && index === now.getMonth() + 1;
  const end = isThisMonth ? now : last;
  return {
    year, month: index,
    start: `${year}-${pad(index)}-01`,
    end: `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`,
  };
}

function previousMonthRange(range) {
  const previous = new Date(range.year, range.month - 2, 1);
  return monthRange(`${previous.getFullYear()}-${String(previous.getMonth() + 1).padStart(2, '0')}`);
}

// ── 통합서버 자원사용현황 ─────────────────────────────────────────────
// 양식대로 전월과 당월을 한 줄에 놓고 비교한다. 자원은 "128C / 896G" 처럼 한 칸에
// 적는다. 07시 배치가 쌓아 둔 일별 값을 그대로 쓰므로 여기서 새로 수집하지 않는다.
const MONTHLY_CLUSTER_KEY = row => `${row.vcenter_id || ''}|${row.cluster_name || ''}`;
// ESXi 한 대를 가리키는 키. 클러스터가 바뀌어도 호스트는 그대로이므로 클러스터는
// 키에 넣지 않는다. 그래야 호스트가 다른 클러스터로 옮겨가도 전월과 이어진다.
const MONTHLY_HOST_KEY = row => `${row.vcenter_id || ''}|${row.esxi_host || ''}`;

function resourcePair(cores, memoryMb) {
  const core = cores == null ? '-' : `${Number(cores).toLocaleString()}C`;
  const memory = memoryMb == null ? '-' : `${Math.round(Number(memoryMb) / 1024).toLocaleString()}G`;
  return `${core} / ${memory}`;
}

function allocationPair(cpuPct, memPct) {
  const text = value => value == null ? '-' : `${Number(value).toLocaleString()}%`;
  const mark = value => value != null && Number(value) >= 100 ? 'text-error'
    : (value != null && Number(value) >= 80 ? 'text-warning' : '');
  return `<span class="${mark(cpuPct)}">${text(cpuPct)}</span> / <span class="${mark(memPct)}">${text(memPct)}</span>`;
}

function clusterLabel(row) {
  const name = row.cluster_display_name || row.cluster_name || '(클러스터 없음)';
  const raw = row.cluster_name || '';
  return name === raw ? syncEscape(name)
    : `${syncEscape(name)}<div class="text-xs text-muted mono">${syncEscape(raw)}</div>`;
}

function hostLabel(row) {
  const name = row.esxi_display_name || row.esxi_host || '(호스트 미상)';
  const raw = row.esxi_host || '';
  return name === raw ? `<span class="mono">${syncEscape(name)}</span>`
    : `${syncEscape(name)}<div class="text-xs text-muted mono">${syncEscape(raw)}</div>`;
}

// 호스트 여러 대를 한 줄로 접는다. 클러스터 합계와 맨 아래 총계가 이걸 쓴다.
// 서버가 내려준 클러스터 집계가 있으면 그걸 그대로 쓰고, 전월에만 있던 묶음처럼
// 집계가 없을 때만 여기서 더한다.
function monthlyFold(rows) {
  if (!rows.length) return null;
  const sum = key => rows.reduce((acc, r) => acc + Number(r[key] || 0), 0);
  const peak = key => {
    const values = rows.map(r => r[key]).filter(v => v != null).map(Number);
    return values.length ? Math.max(...values) : null;
  };
  const mean = key => {
    const values = rows.map(r => r[key]).filter(v => v != null).map(Number);
    return values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length * 10) / 10 : null;
  };
  const cpu = sum('allocated_cpu_cores');
  const memory = sum('allocated_memory_mb');
  const assignedCpu = sum('assigned_cpu_cores');
  const assignedMemory = sum('assigned_memory_mb');
  return {
    vm_count: sum('vm_count'),
    allocated_cpu_cores: cpu, allocated_memory_mb: memory,
    assigned_cpu_cores: assignedCpu, assigned_memory_mb: assignedMemory,
    cpu_alloc_pct: cpu ? Math.round(assignedCpu / cpu * 1000) / 10 : null,
    mem_alloc_pct: memory ? Math.round(assignedMemory / memory * 1000) / 10 : null,
    cpu_max_pct: peak('cpu_max_pct'), mem_max_pct: peak('mem_max_pct'),
    cpu_avg_pct: mean('cpu_avg_pct'), mem_avg_pct: mean('mem_avg_pct'),
  };
}

// 클러스터(통합기) 아래에 ESXi 를 매단 묶음 목록을 만든다. 당월에 없어진 호스트도
// 전월 자료에서 끌어와 한 줄로 남긴다. 빠진 것을 안 보여주면 비교가 아니다.
function monthlyIntegratedGroups(current, previous) {
  const beforeHosts = new Map(((previous && previous.hosts) || []).map(r => [MONTHLY_HOST_KEY(r), r]));
  const beforeClusters = new Map(((previous && previous.clusters) || []).map(r => [MONTHLY_CLUSTER_KEY(r), r]));
  const groups = new Map();
  const touch = row => {
    const key = MONTHLY_CLUSTER_KEY(row);
    if (!groups.has(key)) {
      groups.set(key, {
        key, vcenter_id: row.vcenter_id, cluster_name: row.cluster_name,
        cluster_display_name: row.cluster_display_name, service_name: row.service_name,
        cluster: null, hosts: new Map(),
      });
    }
    return groups.get(key);
  };

  ((current && current.hosts) || []).forEach(row => {
    const key = MONTHLY_HOST_KEY(row);
    touch(row).hosts.set(key, {now: row, old: beforeHosts.get(key) || null});
  });
  ((previous && previous.hosts) || []).forEach(row => {
    const group = touch(row);
    const key = MONTHLY_HOST_KEY(row);
    if (!group.hosts.has(key)) group.hosts.set(key, {now: null, old: row});
  });
  ((current && current.clusters) || []).forEach(row => { touch(row).cluster = row; });

  const list = [...groups.values()];
  list.forEach(group => {
    group.oldCluster = beforeClusters.get(group.key) || null;
    group.rows = [...group.hosts.values()].sort((a, b) =>
      String((a.now || a.old).esxi_host || '').localeCompare(String((b.now || b.old).esxi_host || '')));
  });
  list.sort((a, b) =>
    String(a.service_name || '').localeCompare(String(b.service_name || ''))
    || String(a.vcenter_id || '').localeCompare(String(b.vcenter_id || ''))
    || String(a.cluster_name || '').localeCompare(String(b.cluster_name || '')));
  return list;
}

function monthlyHostChanged(pair) {
  if (!pair.now || !pair.old) return true;           // 새로 생겼거나 없어졌다
  const differs = key => Number(pair.now[key] || 0) !== Number(pair.old[key] || 0);
  return differs('vm_count') || differs('assigned_cpu_cores') || differs('assigned_memory_mb')
    || differs('allocated_cpu_cores') || differs('allocated_memory_mb');
}

function monthlyIntegratedMatches(text, ...values) {
  if (!text) return true;
  return values.some(value => String(value || '').toLowerCase().includes(text));
}

// 줄 하나를 그린다. 이름 칸만 다르고 나머지 열은 클러스터 합계·ESXi·총계가 같다.
function monthlyIntegratedRow(nameCell, vcenter, service, now, old, rowClass) {
  const value = (row, key) => (row && row[key] != null) ? row[key] : null;
  const pct = v => v == null ? '-' : `${Number(v).toLocaleString()}%`;
  const vmNow = value(now, 'vm_count');
  const vmOld = value(old, 'vm_count');
  const delta = (vmNow != null && vmOld != null) ? Number(vmNow) - Number(vmOld) : 0;
  return `<tr class="${rowClass}">
    <td>${nameCell}</td>
    <td class="text-xs mono">${syncEscape(vcenter || '-')}</td>
    <td>${syncEscape(service || '-')}</td>
    <td class="text-muted">${vmOld == null ? '-' : Number(vmOld).toLocaleString()}</td>
    <td>${vmNow == null
      ? '<span class="text-error">없음</span>'
      : `<strong>${Number(vmNow).toLocaleString()}</strong>${delta ? deltaText(delta) : ''}`}</td>
    <td>${now ? resourcePair(value(now, 'allocated_cpu_cores'), value(now, 'allocated_memory_mb')) : '-'}</td>
    <td class="text-muted">${old ? resourcePair(value(old, 'assigned_cpu_cores'), value(old, 'assigned_memory_mb')) : '-'}</td>
    <td>${now ? `<strong>${resourcePair(value(now, 'assigned_cpu_cores'), value(now, 'assigned_memory_mb'))}</strong>` : '-'}</td>
    <td class="text-muted">${old ? allocationPair(value(old, 'cpu_alloc_pct'), value(old, 'mem_alloc_pct')) : '-'}</td>
    <td>${now ? allocationPair(value(now, 'cpu_alloc_pct'), value(now, 'mem_alloc_pct')) : '-'}</td>
    <td>${now ? diskPair(value(now, 'assigned_disk_gb'), value(now, 'used_disk_gb'), value(now, 'disk_fill_pct')) : '-'}</td>
    <td>${pct(value(now, 'cpu_max_pct'))} / ${pct(value(now, 'mem_max_pct'))}</td>
    <td>${pct(value(now, 'cpu_avg_pct'))} / ${pct(value(now, 'mem_avg_pct'))}</td>
  </tr>`;
}

// 통합기 줄의 디스크. ESXi 용량이 아니라 데이터스토어에서 나가는 양이므로
// 비율은 '할당한 것 중 실제로 쓴 몫' 이다. 남은 공간은 아래 데이터스토어 표에서 본다.
function diskPair(assignedGb, usedGb, fillPct) {
  if (assignedGb == null && usedGb == null) return '<span class="text-muted">-</span>';
  const fill = fillPct == null ? '' :
    `<div class="text-xs text-muted">실사용 ${Number(fillPct).toLocaleString()}%</div>`;
  return `${diskSize(assignedGb)} / ${diskSize(usedGb)}${fill}`;
}

// 화면이 다시 그려져야 할 때(검색어·접기·변경분만) 쓰려고 마지막 자료를 들고 있는다.
let monthlyIntegratedState = null;

function renderMonthlyIntegrated(current, previous, range) {
  monthlyIntegratedState = {current, previous, range};
  renderMonthlyIntegratedAgain();
}

function renderMonthlyIntegratedAgain() {
  if (!monthlyIntegratedState) return;
  const {current, previous, range} = monthlyIntegratedState;
  const table = document.getElementById('monthly-integrated-table');
  if (!table) return;
  const search = (document.getElementById('monthly-integrated-search') || {}).value || '';
  const text = search.trim().toLowerCase();
  const foldOnly = !!(document.getElementById('monthly-integrated-fold') || {}).checked;
  const changedOnly = !!(document.getElementById('monthly-integrated-changed') || {}).checked;

  const groups = monthlyIntegratedGroups(current, previous);
  const body = [];
  let hostCount = 0;
  let shownHosts = 0;
  const shownNow = [];

  groups.forEach(group => {
    hostCount += group.rows.length;
    const groupHit = monthlyIntegratedMatches(
      text, group.cluster_name, group.cluster_display_name, group.service_name, group.vcenter_id);
    let pairs = group.rows.filter(pair => {
      const row = pair.now || pair.old;
      return groupHit || monthlyIntegratedMatches(text, row.esxi_host, row.esxi_display_name);
    });
    if (changedOnly) pairs = pairs.filter(monthlyHostChanged);
    if (!pairs.length) return;

    const nowRows = pairs.map(p => p.now).filter(Boolean);
    const oldRows = pairs.map(p => p.old).filter(Boolean);
    // 검색이나 '변경분만' 으로 일부만 남았으면 남은 것만 더해야 표의 합이 맞는다.
    const partial = pairs.length !== group.rows.length;
    const nowTotal = (!partial && group.cluster) ? group.cluster : monthlyFold(nowRows);
    const oldTotal = (!partial && group.oldCluster) ? group.oldCluster : monthlyFold(oldRows);
    const header = `<strong>${clusterLabel(group)}</strong>`
      + `<div class="text-xs text-muted">ESXi ${pairs.length.toLocaleString()}대`
      + (partial ? ` / 전체 ${group.rows.length.toLocaleString()}대` : '') + '</div>';
    body.push(monthlyIntegratedRow(
      header, group.vcenter_id, group.service_name, nowTotal, oldTotal, 'row-group'));
    if (!foldOnly) {
      pairs.forEach(pair => {
        const row = pair.now || pair.old;
        body.push(monthlyIntegratedRow(
          hostLabel(row), row.vcenter_id, row.service_name, pair.now, pair.old, 'row-child'));
      });
    }
    shownHosts += pairs.length;
    nowRows.forEach(row => shownNow.push(row));
  });

  const grand = monthlyFold(shownNow);
  if (grand && body.length) {
    body.push(monthlyIntegratedRow(
      `<strong>합계</strong><div class="text-xs text-muted">ESXi ${shownHosts.toLocaleString()}대</div>`,
      '', '', grand, null, 'row-total'));
  }

  table.className = 'table-sticky';
  table.innerHTML = `<thead>
    <tr>
      <th rowspan="2">클러스터 · ESXi</th><th rowspan="2">vCenter</th><th rowspan="2">서비스명</th>
      <th colspan="2">VM 대수</th>
      <th rowspan="2">실제 자원<div class="text-xs text-muted">C / G</div></th>
      <th colspan="2">VM 할당 (C / G)</th>
      <th colspan="2">할당률 (CPU / MEM)</th>
      <th rowspan="2">VM 디스크<div class="text-xs text-muted">할당 / 사용</div></th>
      <th rowspan="2">사용률 MAX<div class="text-xs text-muted">CPU / MEM</div></th>
      <th rowspan="2">사용률 AVG<div class="text-xs text-muted">CPU / MEM</div></th>
    </tr>
    <tr><th>전월</th><th>당월</th><th>전월</th><th>당월</th><th>전월</th><th>당월</th></tr>
  </thead><tbody>${
    body.length ? body.join('')
      : `<tr><td colspan="13" style="text-align:center" class="text-muted">${
        hostCount ? '조건에 맞는 ESXi 가 없습니다.'
          : '수집된 통합기 자원사용률이 없습니다. 07시 자동배치가 한 번은 돌아야 합니다.'
      }</td></tr>`
  }</tbody>`;

  const shownEl = document.getElementById('monthly-integrated-shown');
  if (shownEl) {
    shownEl.textContent = hostCount
      ? `ESXi ${shownHosts.toLocaleString()} / ${hostCount.toLocaleString()}대 표시`
      : '';
  }
  const previousHosts = ((previous && previous.hosts) || []).length;
  document.getElementById('monthly-integrated-basis').textContent =
    `${range.start} ~ ${range.end} 집계 · 클러스터 ${groups.length.toLocaleString()}개 · ESXi ${hostCount.toLocaleString()}대`
    + (previousHosts ? ` · 전월 ESXi ${previousHosts.toLocaleString()}대와 비교` : ' · 비교할 전월 없음');
}

// ── 데이터스토어 디스크 현황 ───────────────────────────────────────────
// 사용률(지금 차 있는 양)과 할당률(VM 에게 약속한 양)은 다르다. 씬 프로비저닝이면
// 할당이 용량을 넘을 수 있고, 그게 과할당이다. 두 값을 한 줄에 같이 둔다.
const MONTHLY_DATASTORE_KEY = row => `${row.vcenter_id || ''}|${row.datastore_name || ''}`;

function diskSize(gb) {
  if (gb == null) return '-';
  const value = Number(gb);
  return value >= 1024 ? `${(value / 1024).toFixed(1)}TB` : `${Math.round(value).toLocaleString()}GB`;
}

function diskPct(value, warnAt, dangerAt) {
  if (value == null) return '<span class="text-muted">-</span>';
  const number = Number(value);
  const cls = number >= dangerAt ? 'text-error' : (number >= warnAt ? 'text-warning' : '');
  return `<span class="${cls}">${number.toLocaleString()}%</span>`;
}

function datastoreLabel(row) {
  const name = row.datastore_display_name || row.datastore_name || '(이름 없음)';
  const raw = row.datastore_name || '';
  return name === raw ? `<span class="mono">${syncEscape(name)}</span>`
    : `${syncEscape(name)}<div class="text-xs text-muted mono">${syncEscape(raw)}</div>`;
}

function renderMonthlyDatastoresAgain() {
  if (!monthlyIntegratedState) return;
  const {current, previous, range} = monthlyIntegratedState;
  const table = document.getElementById('monthly-datastore-table');
  if (!table) return;
  const rows = (current && current.datastores) || [];
  const before = new Map(((previous && previous.datastores) || []).map(r => [MONTHLY_DATASTORE_KEY(r), r]));
  const riskOnly = !!(document.getElementById('monthly-datastore-risk') || {}).checked;
  // 주의 대상 = 꽉 차가는 것(80% 이상) 또는 약속을 용량보다 많이 한 것.
  const shown = riskOnly
    ? rows.filter(r => r.over_provisioned || !r.accessible || Number(r.used_pct || 0) >= 80)
    : rows;

  table.className = 'table-sticky';
  table.innerHTML = `<thead>
    <tr>
      <th rowspan="2">데이터스토어</th><th rowspan="2">유형</th>
      <th rowspan="2">vCenter<div class="text-xs text-muted">클러스터</div></th>
      <th rowspan="2">실제 용량</th>
      <th colspan="2">사용 (사용률)</th>
      <th colspan="2">VM 할당 (할당률)</th>
      <th rowspan="2">여유</th>
      <th rowspan="2">ESXi</th><th rowspan="2">비고</th>
    </tr>
    <tr><th>전월</th><th>당월</th><th>전월</th><th>당월</th></tr>
  </thead><tbody>${
    shown.length ? shown.map(row => {
      const old = before.get(MONTHLY_DATASTORE_KEY(row)) || {};
      const notes = [];
      if (!row.accessible) notes.push('<span class="badge badge-red">접속불가</span>');
      if (row.over_provisioned) notes.push('<span class="badge badge-yellow">과할당</span>');
      if (row.used_pct_max != null && Number(row.used_pct_max) > Number(row.used_pct || 0) + 5) {
        notes.push(`<span class="text-xs text-muted">기간 최대 ${Number(row.used_pct_max).toLocaleString()}%</span>`);
      }
      const delta = (row.used_gb != null && old.used_gb != null)
        ? Number(row.used_gb) - Number(old.used_gb) : null;
      return `<tr>
        <td>${datastoreLabel(row)}</td>
        <td class="text-xs">${syncEscape(row.datastore_type || '-')}</td>
        <td class="text-xs mono">${syncEscape(row.vcenter_id || '-')}
          <div class="text-xs text-muted">${syncEscape(row.cluster_display_name || row.cluster_name || '공용')}</div></td>
        <td>${diskSize(row.capacity_gb)}</td>
        <td class="text-muted">${old.used_gb == null ? '-' : `${diskSize(old.used_gb)} (${Number(old.used_pct || 0).toLocaleString()}%)`}</td>
        <td><strong>${diskSize(row.used_gb)}</strong> ${diskPct(row.used_pct, 80, 90)}
          ${delta ? `<div class="text-xs ${delta > 0 ? 'text-warning' : 'text-success'}">${delta > 0 ? '+' : ''}${diskSize(Math.abs(delta))}</div>` : ''}</td>
        <td class="text-muted">${old.provisioned_gb == null ? '-' : `${diskSize(old.provisioned_gb)} (${Number(old.provision_pct || 0).toLocaleString()}%)`}</td>
        <td><strong>${diskSize(row.provisioned_gb)}</strong> ${diskPct(row.provision_pct, 100, 150)}</td>
        <td>${diskSize(row.free_gb)}</td>
        <td>${Number(row.host_count || 0).toLocaleString()}</td>
        <td>${notes.join(' ') || '<span class="text-muted">-</span>'}</td>
      </tr>`;
    }).join('')
    : `<tr><td colspan="11" style="text-align:center" class="text-muted">${
      rows.length ? '주의할 데이터스토어가 없습니다.'
        : '수집된 데이터스토어가 없습니다. 07시 자동배치가 새 스크립트로 한 번은 돌아야 합니다.'
    }</td></tr>`
  }</tbody>`;

  const disk = (current && current.disk) || {};
  const text = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };
  text('monthly-disk-capacity', diskSize(disk.capacity_gb));
  text('monthly-disk-count', `데이터스토어 ${Number(disk.datastore_count || 0).toLocaleString()}개`
    + (disk.inaccessible_count ? ` · 접속불가 ${disk.inaccessible_count}개` : ''));
  text('monthly-disk-used', disk.used_pct == null ? diskSize(disk.used_gb)
    : `${diskSize(disk.used_gb)} (${Number(disk.used_pct).toLocaleString()}%)`);
  text('monthly-disk-provisioned', disk.provision_pct == null ? diskSize(disk.provisioned_gb)
    : `${diskSize(disk.provisioned_gb)} (${Number(disk.provision_pct).toLocaleString()}%)`);
  text('monthly-disk-over', Number(disk.over_provisioned || 0).toLocaleString());

  const previousDisk = (previous && previous.disk) || {};
  const deltaText2 = (id, now, was, label) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (now == null || was == null) { el.textContent = label; return; }
    const diff = Math.round((Number(now) - Number(was)) * 10) / 10;
    el.textContent = `전월 ${Number(was).toLocaleString()}% → ${diff > 0 ? '+' : ''}${diff}%p`;
  };
  deltaText2('monthly-disk-used-delta', disk.used_pct, previousDisk.used_pct, '비교할 전월 없음');
  deltaText2('monthly-disk-prov-delta', disk.provision_pct, previousDisk.provision_pct, '비교할 전월 없음');

  const basis = document.getElementById('monthly-datastore-basis');
  if (basis) {
    basis.textContent = `${range.start} ~ ${range.end} 기준 · ${shown.length.toLocaleString()} / ${rows.length.toLocaleString()}개 표시`
      + (before.size ? ` · 전월 ${before.size.toLocaleString()}개와 비교` : '');
  }
}

function renderMonthlyIntegratedMoves(current) {
  const body = document.getElementById('monthly-integrated-moves');
  // 변경 이력은 ESXi 이름만 갖고 있다. 통합기(클러스터) 이름은 통합기 표에서 찾는다.
  const clusterOf = new Map((current.hosts || []).map(h => [
    `${h.vcenter_id || ''}|${h.esxi_host || ''}`,
    h.cluster_display_name || h.cluster_name || h.esxi_host || '-',
  ]));
  const moves = new Map();
  (current.changes || []).forEach(change => {
    if (change.event_type !== 'RV_NEW' && change.event_type !== 'RV_REMOVED') return;
    const name = clusterOf.get(`${change.vcenter_id || ''}|${change.esxi_host || ''}`)
      || change.esxi_host || '(통합기 미상)';
    if (!moves.has(name)) moves.set(name, {created: [], removed: []});
    moves.get(name)[change.event_type === 'RV_NEW' ? 'created' : 'removed'].push(change.vm_name || change.asset_key);
  });

  const rows = [...moves.entries()].sort((a, b) =>
    (b[1].created.length + b[1].removed.length) - (a[1].created.length + a[1].removed.length));
  body.innerHTML = rows.length ? rows.map(([name, item]) => {
    const net = item.created.length - item.removed.length;
    const names = [...item.created.map(n => `+${n}`), ...item.removed.map(n => `-${n}`)];
    return `<tr>
      <td><strong>${syncEscape(name)}</strong></td>
      <td class="text-success">${item.created.length.toLocaleString()}</td>
      <td class="text-error">${item.removed.length.toLocaleString()}</td>
      <td><strong>${net > 0 ? '+' : ''}${net.toLocaleString()}</strong></td>
      <td class="text-xs">${syncEscape(names.slice(0, 20).join(', '))}${names.length > 20 ? ` 외 ${names.length - 20}건` : ''}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" style="text-align:center" class="text-muted">이 달에 생성·삭제된 VM 이 없습니다.</td></tr>';
}

// 통합서버 자원사용현황은 vCenter 자료다. ITSM 자산 목록과 출처가 달라
// 보고서 쪽 추출(통합기·VM·변경이력)을 그 달 범위로 부른다.
async function exportMonthlyIntegrated() {
  const alertEl = document.getElementById('monthly-integrated-alert');
  const range = monthRange(document.getElementById('monthly-month').value);
  alertEl.innerHTML = '<div class="alert alert-info"><span class="loading"></span> Excel 생성 중...</div>';
  const response = await fetch(`/api/asset-sync/resource-usage/export?start=${range.start}&end=${range.end}`);
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(data.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `통합서버_자원사용현황_${range.start}_${range.end}.xlsx`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  alertEl.innerHTML = '<div class="alert alert-success">✅ Excel 을 내려받았습니다.</div>';
}

async function loadMonthlyIntegrated(month) {
  const alertEl = document.getElementById('monthly-integrated-alert');
  if (!alertEl) return;
  const range = monthRange(month);
  const previousRange = previousMonthRange(range);
  alertEl.innerHTML = '<div class="alert alert-info"><span class="loading"></span> 통합서버 자원사용현황 집계 중...</div>';
  try {
    const url = r => `/api/asset-sync/resource-usage?start=${r.start}&end=${r.end}`;
    // 전월이 없어도 당월은 보여야 한다.
    const [current, previous] = await Promise.all([
      apiFetch(url(range)),
      apiFetch(url(previousRange)).catch(() => null),
    ]);
    alertEl.innerHTML = '';
    renderMonthlyIntegrated(current, previous, range);
    renderMonthlyDatastoresAgain();
    renderMonthlyIntegratedMoves(current);
  } catch (error) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(error.message)}</div>`;
  }
}
</script>
