{# 자산 목록 창 스크립트 #}
<script>
// 어느 화면에서 열었는지와 무엇으로 걸렀는지. 검색어만 바꿔 다시 부를 때 쓴다.
let assetBrowserFilter = {};
let assetBrowserRows = [];
let assetBrowserSelected = new Set();
let assetBrowserTimer = null;
let assetBrowserSource = 'ITSM';
const ASSET_BROWSER_ADMIN = {{ 'true' if user.role == 'admin' else 'false' }};

function openAssetBrowser(filter, title) {
  assetBrowserFilter = Object.assign({}, filter || {});
  assetBrowserSource = String(assetBrowserFilter.source || 'ITSM').toUpperCase();
  // VM 목록에는 물리/논리 구분이 없다. ITSM 자산에만 쓰는 칸은 숨긴다.
  document.querySelectorAll('.asset-browser-itsm-only').forEach(el => {
    el.hidden = assetBrowserSource === 'RVTOOLS';
  });
  assetBrowserSelected = new Set();
  document.getElementById('asset-browser-title').textContent = title || '자산 목록';
  document.getElementById('asset-browser-search').value = assetBrowserFilter.q || '';
  document.getElementById('asset-browser-state').value = assetBrowserFilter.state || '';
  document.getElementById('asset-browser-kind').value = assetBrowserFilter.kind || '';
  document.getElementById('asset-browser').classList.add('show');
  loadAssetBrowser();
}

function closeAssetBrowser() {
  document.getElementById('asset-browser').classList.remove('show');
}

// 글자를 칠 때마다 서버를 부르면 느리다. 잠깐 멈췄을 때 한 번만 부른다.
function debounceAssetBrowser() {
  clearTimeout(assetBrowserTimer);
  assetBrowserTimer = setTimeout(loadAssetBrowser, 250);
}

async function loadAssetBrowser() {
  const body = document.getElementById('asset-browser-body');
  if (!body) return;
  const query = assetBrowserQuery();
  query.set('limit', '5000');

  body.innerHTML = '<tr><td colspan="11" style="text-align:center"><span class="loading"></span> 불러오는 중…</td></tr>';
  let data;
  try {
    data = await apiFetch('/api/asset-sync/assets?' + query);
  } catch (error) {
    document.getElementById('asset-browser-alert').innerHTML =
      `<div class="alert alert-error">❌ ${syncEscape(error.message)}</div>`;
    body.innerHTML = '';
    return;
  }
  document.getElementById('asset-browser-alert').innerHTML = '';
  if (data.status === 'NO_SNAPSHOT') {
    body.innerHTML = `<tr><td colspan="11" style="text-align:center" class="text-muted">${syncEscape(data.message)}</td></tr>`;
    return;
  }
  assetBrowserRows = data.items || [];
  renderAssetBrowser(data);
}

function assetEosl(row) {
  if (row.eosl_value == null || row.eosl_value === '') return '<span class="text-muted">없음</span>';
  const year = row.eosl_year;
  const field = row.eosl_field ? `<div class="text-xs text-muted mono">${syncEscape(row.eosl_field)}</div>` : '';
  return `${syncEscape(row.eosl_value)}${year ? '' : ' <span class="text-error text-xs">(연도 못 읽음)</span>'}${field}`;
}

function assetState(row) {
  if (!row.exclude_reason) {
    return row.manual
      ? '<span class="badge badge-blue">자산(수동 포함)</span>'
      : '<span class="badge badge-green">자산</span>';
  }
  const label = row.exclude_label || row.exclude_reason;
  const note = row.manual_note ? `<div class="text-xs text-muted">${syncEscape(row.manual_note)}</div>` : '';
  // 왜 빠졌는지는 판단에 쓴 값까지 보여야 따질 수 있다.
  const fields = Object.entries(row.exclude_fields || {})
    .map(([name, value]) => `${syncEscape(name)}=${value == null || value === '' ? '(빔)' : syncEscape(value)}`)
    .join(' · ');
  return `<span class="badge badge-red">제외</span>`
    + `<div class="text-xs text-muted">${syncEscape(label)}</div>${note}`
    + (row.exclude_reason === 'EMPTY' && fields ? `<div class="text-xs text-muted mono">${fields}</div>` : '');
}

// 출처마다 보여 줄 열이 다르다. VM 에는 위치·EOSL 이 없고 통합기·전원이 있다.
const ASSET_BROWSER_HEADERS = {
  ITSM: ['자산번호','업무명','호스트명','IP','위치','물리/논리','OS','OS버전','EOSL','상태'],
  RVTOOLS: ['VM 이름','호스트명','IP','vCenter','통합기','ESXi','전원','OS','vCPU / MEM','상태'],
};

function assetBrowserRow(row) {
  if (assetBrowserSource === 'RVTOOLS') {
    return `<td><strong>${syncEscape(row.vm_name || '-')}</strong></td>
      <td>${syncEscape(row.hostname || '-')}</td>
      <td class="mono">${syncEscape(row.primary_ip || '-')}</td>
      <td>${syncEscape(row.vcenter_id || '-')}</td>
      <td>${syncEscape(row.cluster_name || '-')}</td>
      <td>${syncEscape(row.esxi_host || '-')}</td>
      <td>${syncBadge(row.power_state || '-')}</td>
      <td>${syncEscape(row.os_family || '-')}<div class="text-xs text-muted">${syncEscape(row.os_version || '')}</div></td>
      <td>${row.cpus == null ? '-' : row.cpus} / ${row.memory_mb == null ? '-' : Math.round(Number(row.memory_mb) / 1024) + 'GB'}</td>
      <td>${assetState(row)}</td>`;
  }
  return `<td class="mono">${syncEscape(row.cm_id || '-')}</td>
    <td>${syncEscape(row.service_name || '-')}</td>
    <td>${syncEscape(row.hostname || '-')}</td>
    <td class="mono">${syncEscape(row.primary_ip || '-')}</td>
    <td>${syncEscape(row.location || '-')}<div class="text-xs text-muted">${syncEscape(row.place || '')}</div></td>
    <td>${row.physical ? '물리' : '논리'}</td>
    <td>${syncEscape(row.os_family || '-')}<div class="text-xs text-muted">${syncEscape(row.os_group || '')}</div></td>
    <td>${syncEscape(row.os_version || '-')}</td>
    <td>${assetEosl(row)}</td>
    <td>${assetState(row)}</td>`;
}

function renderAssetBrowser(data) {
  const body = document.getElementById('asset-browser-body');
  const head = document.getElementById('asset-browser-head');
  const rows = assetBrowserRows;
  const headers = ASSET_BROWSER_HEADERS[assetBrowserSource] || ASSET_BROWSER_HEADERS.ITSM;
  const span = headers.length + (ASSET_BROWSER_ADMIN ? 1 : 0);
  head.innerHTML = (ASSET_BROWSER_ADMIN ? '<th style="width:34px"></th>' : '')
    + headers.map(name => `<th>${syncEscape(name)}</th>`).join('');

  const checkbox = row => ASSET_BROWSER_ADMIN
    ? `<td><input type="checkbox" class="asset-row-check" value="${syncEscape(row.asset_key)}"
         ${assetBrowserSelected.has(row.asset_key) ? 'checked' : ''} onchange="toggleAssetRow(this)"></td>` : '';

  body.innerHTML = rows.length
    ? rows.map(row => `<tr>${checkbox(row)}${assetBrowserRow(row)}</tr>`).join('')
    : `<tr><td colspan="${span}" style="text-align:center" class="text-muted">조건에 맞는 대상이 없습니다.</td></tr>`;

  const counted = rows.filter(r => !r.exclude_reason).length;
  const unit = assetBrowserSource === 'RVTOOLS' ? 'VM' : '자산';
  document.getElementById('asset-browser-count').textContent =
    `${Number(data.total || 0).toLocaleString()}건` + (data.truncated ? ' (5,000건까지 표시)' : '')
    + ` · ${unit} ${counted.toLocaleString()} / 제외 ${(rows.length - counted).toLocaleString()}`;
  const scope = data.scope || {};
  const reasons = Object.entries(scope.by_reason || {})
    .map(([, item]) => `${item.label} ${Number(item.count).toLocaleString()}`).join(' · ');
  document.getElementById('asset-browser-basis').textContent =
    `${data.as_of || '-'} 스냅샷 · ${assetBrowserSource === 'RVTOOLS' ? 'vCenter' : 'ITSM'} 전체 `
    + `${Number(data.snapshot_total || 0).toLocaleString()}건 기준`
    + (reasons ? ` · 제외 ${reasons}` : '');
  updateAssetSelection();
}

function toggleAssetRow(input) {
  if (input.checked) assetBrowserSelected.add(input.value);
  else assetBrowserSelected.delete(input.value);
  updateAssetSelection();
}

function toggleAllAssetRows(checked) {
  document.querySelectorAll('.asset-row-check').forEach(input => {
    input.checked = checked;
    if (checked) assetBrowserSelected.add(input.value);
    else assetBrowserSelected.delete(input.value);
  });
  updateAssetSelection();
}

function updateAssetSelection() {
  const holder = document.getElementById('asset-browser-selected');
  if (holder) holder.textContent = `선택 ${assetBrowserSelected.size.toLocaleString()}건`;
}

// 지금 화면에 걸러져 있는 조건을 그대로 서버에 넘긴다. 화면과 파일의 대상이
// 달라지면 안 되므로 조건을 다시 만들지 않고 같은 함수로 만든다.
function assetBrowserQuery() {
  const query = new URLSearchParams();
  query.set('source', assetBrowserSource);
  Object.entries(assetBrowserFilter).forEach(([key, value]) => {
    if (value && key !== 'q' && key !== 'state' && key !== 'kind') query.set(key, value);
  });
  const term = document.getElementById('asset-browser-search').value.trim();
  const state = document.getElementById('asset-browser-state').value;
  const kind = document.getElementById('asset-browser-kind').value;
  if (term) query.set('q', term);
  if (state) query.set('state', state);
  if (kind) query.set('kind', kind);
  return query;
}

async function exportAssetBrowser() {
  const alertEl = document.getElementById('asset-browser-alert');
  const query = assetBrowserQuery();
  query.set('title', document.getElementById('asset-browser-title').textContent.trim());
  alertEl.innerHTML = '<div class="alert alert-info"><span class="loading"></span> Excel 생성 중...</div>';
  let response;
  try {
    response = await fetch('/api/asset-sync/assets/export?' + query);
  } catch (error) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(error.message)}</div>`;
    return;
  }
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(data.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const disposition = response.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  link.href = url;
  link.download = match ? decodeURIComponent(match[1]) : '자산목록.xlsx';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  alertEl.innerHTML = '<div class="alert alert-success">✅ Excel 을 내려받았습니다. ITSM 원본 전 컬럼이 들어 있습니다.</div>';
}

// ── 엑셀로 한꺼번에 ──────────────────────────────────────────────────
// 300 건을 바로 반영한 뒤 "어? 몇 건이 왜 빠졌지" 를 묻게 되면 되돌리기가
// 번거롭다. 먼저 읽어만 보고 결과를 보여 준 다음 적용한다.
let assetBulkReady = false;

function assetBulkForm(apply) {
  const input = document.getElementById('asset-bulk-file');
  if (!input.files || !input.files.length) return null;
  const form = new FormData();
  form.append('file', input.files[0]);
  form.append('source', assetBrowserSource);
  form.append('mode', document.getElementById('asset-bulk-mode').value);
  form.append('reason', document.getElementById('asset-browser-reason').value.trim());
  if (apply) form.append('apply', '1');
  return form;
}

function renderAssetBulk(data, applied) {
  const holder = document.getElementById('asset-bulk-result');
  const parsed = data.parsed || {};
  const counts = parsed.counts || {};
  const label = {EXCLUDE: '제외', INCLUDE: '포함', AUTO: '자동 판정'};
  const lines = [];

  Object.entries(label).forEach(([mode, name]) => {
    if (counts[mode]) lines.push(`${name} <strong>${Number(counts[mode]).toLocaleString()}건</strong>`);
  });
  let html = `<div class="alert ${applied ? 'alert-success' : 'alert-info'}" style="margin-bottom:6px">`
    + (applied ? '✅ 적용했습니다. ' : '읽었습니다(아직 적용 전). ')
    + (lines.join(' · ') || '적용할 줄이 없습니다.')
    + ` <span class="text-muted">머리글 ${parsed.header_row || '?'}행 기준</span></div>`;

  // 넘어간 줄은 반드시 알려 준다. 몇 건이 왜 빠졌는지 모르면 더 나쁘다.
  if (counts.blank) {
    html += `<div class="text-muted">· [처리] 칸이 빈 줄 ${Number(counts.blank).toLocaleString()}건은 그대로 두었습니다.`
      + ` 전체에 같은 처리를 하려면 위 선택을 바꾸세요.</div>`;
  }
  if (counts.unknown) {
    html += `<div class="text-error">· 알 수 없는 값 ${counts.unknown}건 (제외/포함/자동 중에서 적어야 합니다): `
      + (parsed.unknown || []).map(u => `${u.row}행 "${syncEscape(u.value)}"`).join(', ') + '</div>';
  }
  if (counts.duplicated) {
    html += `<div class="text-warning">· 같은 자산번호가 두 번 나온 줄 ${counts.duplicated}건은 첫 줄만 썼습니다.</div>`;
  }
  if (counts.not_found) {
    html += `<div class="text-warning">· 지금 ITSM 에 없는 자산번호 ${counts.not_found}건: `
      + (parsed.not_found || []).slice(0, 10).map(k => syncEscape(k)).join(', ')
      + (counts.not_found > 10 ? ' 외' : '')
      + ' (오타이거나 이미 삭제된 자산입니다. 규칙은 저장되지만 집계에는 영향이 없습니다.)</div>';
  }
  holder.innerHTML = html;
}

async function previewAssetBulk() {
  const holder = document.getElementById('asset-bulk-result');
  const button = document.getElementById('asset-bulk-apply');
  assetBulkReady = false;
  button.disabled = true;
  const form = assetBulkForm(false);
  if (!form) { holder.innerHTML = ''; return; }
  holder.innerHTML = '<span class="loading"></span> 파일을 읽는 중...';
  const response = await fetch('/api/asset-sync/admin/asset-exclusions/upload', {method: 'POST', body: form});
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.success) {
    holder.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(data.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  renderAssetBulk(data, false);
  assetBulkReady = Number((data.parsed || {}).items ? data.parsed.items.length : 0) > 0
    || Number((data.parsed.counts || {}).total || 0) > 0;
  button.disabled = !assetBulkReady;
}

async function applyAssetBulk() {
  const holder = document.getElementById('asset-bulk-result');
  const form = assetBulkForm(true);
  if (!form) return;
  if (!assetBulkReady) { await previewAssetBulk(); return; }
  holder.innerHTML = '<span class="loading"></span> 적용 중...';
  const response = await fetch('/api/asset-sync/admin/asset-exclusions/upload', {method: 'POST', body: form});
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.success) {
    holder.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(data.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  renderAssetBulk(data, true);
  document.getElementById('asset-bulk-apply').disabled = true;
  assetBulkReady = false;
  await loadAssetBrowser();
  refreshCountsAfterScopeChange();
}

// 대수가 바뀌었으므로 열려 있는 화면도 다시 센다.
function refreshCountsAfterScopeChange() {
  const active = id => document.getElementById(id)?.classList.contains('active');
  if (typeof loadDashboard === 'function' && active('page-dashboard')) loadDashboard();
  if (typeof loadMonthlyCheck === 'function' && active('page-monthly_check')) loadMonthlyCheck();
  if (typeof loadDailyCheck === 'function' && active('page-daily_check')) loadDailyCheck();
  // VM 을 뺐으면 자원사용현황의 대수·할당률도 달라진다.
  if (typeof loadResourceUsage === 'function' && active('page-report')) loadResourceUsage();
}

async function applyAssetScope(mode) {
  if (!assetBrowserSelected.size) {
    document.getElementById('asset-browser-alert').innerHTML =
      '<div class="alert alert-warning">⚠️ 대상을 먼저 선택하세요.</div>';
    return;
  }
  const chosen = assetBrowserRows.filter(row => assetBrowserSelected.has(row.asset_key));
  const response = await fetch('/api/asset-sync/admin/asset-exclusions', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      source: assetBrowserSource,
      mode,
      reason: document.getElementById('asset-browser-reason').value.trim(),
      items: chosen.map(row => ({
        asset_key: row.asset_key, hostname: row.hostname,
        primary_ip: row.primary_ip, service_name: row.service_name || row.vm_name,
      })),
    }),
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok || !result.success) {
    document.getElementById('asset-browser-alert').innerHTML =
      `<div class="alert alert-error">❌ ${syncEscape(result.error || 'HTTP ' + response.status)}</div>`;
    return;
  }
  const label = mode === 'EXCLUDE' ? '자산에서 제외' : mode === 'INCLUDE' ? '자산에 포함' : '자동 판정으로 되돌림';
  document.getElementById('asset-browser-alert').innerHTML =
    `<div class="alert alert-success">✅ ${result.changed}건을 ${label}했습니다. 모든 화면에 함께 적용됩니다.</div>`;
  assetBrowserSelected = new Set();
  document.getElementById('asset-browser-all').checked = false;
  await loadAssetBrowser();
  refreshCountsAfterScopeChange();
}
</script>
