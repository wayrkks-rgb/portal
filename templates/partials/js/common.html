{# 셸 공통 스크립트: 전역 상태, 페이지 전환, 연계 모듈 BFF 호출, 표시 헬퍼, 초기화 #}
<script>
// ── 전역 상태 ──
const state = {
  asisFile: null, tobeFile: null,
  cmpAsisFile: null, cmpTobeFile: null,
  menus: [], history: []
};

// ── 날짜 ──
document.getElementById('today-date').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'short'});

// ── API 호출 ──
// 화면이 조용히 멈추지 않게 한다. 주소가 서버에 없거나(404) 로그인이 풀렸으면(401)
// 서버는 JSON 이 아닌 것을 돌려준다. 그대로 r.json() 을 부르면 예외만 나고 화면은
// "조회 중..." 에서 멈춰 무엇이 잘못됐는지 알 수 없다. 여기서 주소까지 적어 준다.
async function apiFetch(url) {
  let response;
  try {
    response = await fetch(url);
  } catch (error) {
    throw new Error(`서버에 연결하지 못했습니다 (${url}): ${error.message}`);
  }
  const text = await response.text();
  let data = null;
  try {
    data = text ? JSON.parse(text) : null;
  } catch (error) {
    if (response.status === 404) {
      throw new Error(`화면이 찾는 주소가 서버에 없습니다: ${url} (404).`
        + ' 웹을 최신 파일로 덮어쓴 뒤 다시 시작했는지 확인하세요.');
    }
    throw new Error(`서버 응답을 읽지 못했습니다: ${url} (HTTP ${response.status})`);
  }
  if (!response.ok) {
    throw new Error((data && data.error) || `${url} 요청이 실패했습니다 (HTTP ${response.status})`);
  }
  return data;
}

// ── 페이지 전환 ──
// 대메뉴 화면이 열릴 때 부를 함수. 모듈의 scripts.html 이 PAGE_LOADERS['<page>'] = fn 으로
// 등록한다. 담당자가 이 파일의 showPage 에 if 를 덧붙이면 병합 때마다 충돌하기 때문이다.
const PAGE_LOADERS = {};
function runPageLoader(id){
  const loader = PAGE_LOADERS[id];
  if(typeof loader !== 'function') return;
  try{ loader(); }catch(error){ console.error(`화면 ${id} 불러오기 실패`, error); }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const el = document.getElementById(`page-${id}`);
  if(el) el.classList.add('active');
  if (id === 'history') loadHistory();
  if (id === 'admin_mapping') loadMenus();
  if (id === 'admin_users') loadUsers();
  if (id === 'integration_settings') loadIntegrationSettings();
  if (id === 'dashboard') loadDashboard();
  if (id === 'daily_check') loadDailyCheck();
  if (id === 'weekly_check') loadWeeklyCheck();
  if (id === 'monthly_check') loadMonthlyCheck();
  if (id === 'report') loadResourceUsage();
  if (id === 'asset_sync') loadAssetSyncDashboard();
  if (id === 'dashboard') loadModulePanels();
  runPageLoader(id);
}

// ── 연계 모듈 (BFF 호출) ──
// 통합 웹이 서버에서 각 WAS 를 호출하므로 브라우저는 항상 통합 웹만 바라본다.
const PORTAL_MODULES = {{ portal_modules | default([]) | tojson }};

function moduleById(id){ return PORTAL_MODULES.find(m => m.id === id) || null; }

function showModulePage(moduleId){
  const module = moduleById(moduleId);
  if(!module) return;
  showPage(module.page);
  loadModulePage(moduleId);
}

// 소메뉴 클릭. 담당자가 자기 화면(page-<child.page>)을 제공했으면 그 화면으로
// 전환하고, 없으면 공통 화면에서 해당 소메뉴의 패널을 다시 받아 그린다.
function showModuleMenu(moduleId, childId){
  const module = moduleById(moduleId);
  if(!module) return;
  const child = (module.children || []).find(c => c.id === childId);
  const ownPage = child && document.getElementById(`page-${child.page}`);
  if(ownPage){ showPage(child.page); return; }
  showPage(module.page);
  loadModulePage(moduleId, childId);
}

// config/modules/*.yaml 을 다시 읽는다. 대메뉴를 추가할 때마다 통합 웹을 재시작하면
// 다른 담당자들의 화면까지 잠깐 끊긴다. 메뉴는 새로고침해야 다시 그려진다.
async function reloadModuleRegistry(){
  setButtonBusy('btn-reload-modules', true, '읽는 중', '대메뉴 다시 읽기');
  const res = await integrationFetch('/api/modules/reload', {method:'POST'});
  setButtonBusy('btn-reload-modules', false, '', '대메뉴 다시 읽기');
  if(res.status !== 'SUCCESS'){
    integrationToast(`대메뉴 재적용 실패: ${res.error || '알 수 없는 오류'}`, 'error');
    return;
  }
  const changes = [];
  if(res.added?.length) changes.push(`추가 ${res.added.join(', ')}`);
  if(res.removed?.length) changes.push(`제거 ${res.removed.join(', ')}`);
  integrationToast(
    changes.length ? `대메뉴 재적용 완료 · ${changes.join(' · ')} · 새로고침하면 메뉴에 반영됩니다`
                   : `대메뉴 ${res.modules.length}개 · 변경 없음`,
    changes.length ? 'success' : 'info');
}

// 12칸 격자에서 이 패널이 차지할 칸. 대메뉴 화면에서는 하나만 그리므로 전체 폭.
function panelSpanClass(entry, full){
  if(full) return 'dash-w-12';
  const width = Math.min(12, Math.max(1, Number(entry.dashboard_width) || 4));
  const height = Math.min(4, Math.max(1, Number(entry.dashboard_height) || 1));
  return `dash-w-${width}${height > 1 ? ` dash-h-${height}` : ''}`;
}

function renderPanelCard(entry, full){
  const failed = entry.status !== 'SUCCESS';
  const panel = entry.panel || {};
  const statusBadge = {
    SUCCESS:'<span class="badge badge-green">정상</span>',
    TIMEOUT:'<span class="badge badge-yellow">응답 지연</span>',
    UNREACHABLE:'<span class="badge badge-red">연결 실패</span>',
    SKIPPED:'<span class="badge">미제공</span>'
  }[entry.status] || '<span class="badge badge-red">오류</span>';
  const metrics = (panel.metrics || []).map(m=>`
    <div class="module-metric ${escapeHtml(m.state||'info')}">
      <div class="module-metric-value">${m.value===null||m.value===undefined?'-':escapeHtml(typeof m.value==='number'?fmtNumber(m.value):m.value)}${m.unit?`<span style="font-size:11px;font-weight:600"> ${escapeHtml(m.unit)}</span>`:''}</div>
      <div class="module-metric-label">${escapeHtml(m.label)}</div>
    </div>`).join('');
  const table = panel.table && panel.table.columns && panel.table.columns.length ? `
    <div class="table-wrap" style="max-height:220px;overflow:auto">
      <table><thead><tr>${panel.table.columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
      <tbody>${(panel.table.rows||[]).map(r=>`<tr>${r.map(v=>`<td class="mono">${v===null||v===undefined?'-':escapeHtml(typeof v==='number'?fmtNumber(v):v)}</td>`).join('')}</tr>`).join('')
        || `<tr><td colspan="${panel.table.columns.length}" style="text-align:center" class="text-muted">데이터가 없습니다.</td></tr>`}</tbody></table>
    </div>` : '';
  return `
    <div class="module-panel${failed?' failed':''} ${panelSpanClass(entry, full)}">
      <div class="module-panel-head">
        <div class="module-panel-title"><span>${escapeHtml(entry.icon||'🧩')}</span>${escapeHtml(panel.title || entry.module_name)}</div>
        <div class="flex gap-2" style="align-items:center">${statusBadge}<span class="text-xs text-muted">${entry.elapsed_ms||0}ms</span></div>
      </div>
      ${failed
        ? `<div class="alert alert-error" style="margin:0">${escapeHtml(entry.error || '모듈 응답을 받지 못했습니다.')}</div>`
        : `${metrics?`<div class="module-panel-metrics">${metrics}</div>`:''}${table}
           ${panel.note?`<div class="text-xs text-muted" style="margin-top:10px">${escapeHtml(panel.note)}</div>`:''}`}
    </div>`;
}

async function loadModulePanels(){
  const container = document.getElementById('module-panels');
  const statusEl = document.getElementById('module-panels-status');
  if(!container) return;
  setButtonBusy('btn-refresh-panels', true, '조회 중', '모듈 현황 새로고침');
  // 격자 안이므로 칸 수를 준다. 클래스가 없으면 1칸으로 찌그러진다.
  container.innerHTML = '<div class="text-sm text-muted dash-w-12"><span class="loading"></span> 모듈 현황을 불러오는 중...</div>';
  const res = await integrationFetch('/api/modules/dashboard');
  setButtonBusy('btn-refresh-panels', false, '', '모듈 현황 새로고침');
  if(res.error && !res.panels){
    statusEl.innerHTML = `<div class="alert alert-error">모듈 현황 조회 실패: ${escapeHtml(res.error)}</div>`;
    container.innerHTML = '';
    return;
  }
  const panels = res.panels || [];
  const counts = res.counts || {};
  // 일부 모듈이 실패해도 나머지 패널은 그대로 보여준다.
  statusEl.innerHTML = panels.length
    ? (res.degraded
        ? `<div class="alert alert-warning">모듈 ${counts.total}개 중 ${counts.success}개 정상 · 실패 ${counts.failed||0} · 미제공 ${counts.skipped||0} (${res.elapsed_ms||0}ms)</div>`
        : `<div class="alert alert-success">모듈 ${counts.total}개 전부 정상 (${res.elapsed_ms||0}ms)</div>`)
    : '<div class="alert alert-info">등록된 연계 모듈이 없습니다. 관리자가 모듈 레지스트리에 대메뉴를 추가하면 여기에 표시됩니다.</div>';
  // map 의 2번째 인자(index)가 full 로 넘어가지 않도록 명시적으로 감싼다.
  container.innerHTML = panels.map(entry => renderPanelCard(entry, false)).join('');
}

async function loadModulePage(moduleId, menu){
  const statusEl = document.getElementById(`module-page-status-${moduleId}`);
  const bodyEl = document.getElementById(`module-page-body-${moduleId}`);
  if(!bodyEl) return;
  bodyEl.innerHTML = '<div class="text-sm text-muted dash-w-12"><span class="loading"></span> 모듈 데이터를 불러오는 중...</div>';
  // menu 는 그대로 WAS 의 panel_path 질의로 전달된다. 소메뉴별 화면은 WAS 가 정한다.
  const query = `modules=${encodeURIComponent(moduleId)}${menu ? `&menu=${encodeURIComponent(menu)}` : ''}`;
  const res = await integrationFetch(`/api/modules/dashboard?${query}`);
  const panels = (res.panels || []);
  if(!panels.length){
    statusEl.innerHTML = `<div class="alert alert-error">${escapeHtml(res.error || '모듈 응답을 받지 못했습니다.')}</div>`;
    bodyEl.innerHTML = '';
    return;
  }
  statusEl.innerHTML = '';
  // 대메뉴 화면은 패널 하나를 전체 폭으로 그린다. 축소는 통합 대시보드에서만 한다.
  bodyEl.innerHTML = panels.map(entry => renderPanelCard(entry, true)).join('');
}

// ── 대시보드 ──
// ── 공통 표시 헬퍼 (분할 전에는 각 화면 스크립트에 흩어져 있었다) ──
function dashboardDateText(value){return value?new Date(value).toLocaleString('ko-KR'):'-';}
function dashboardNumber(value){return Number(value||0).toLocaleString();}
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function fmtNumber(n) { return Number(n || 0).toLocaleString('ko-KR'); }
function syncEscape(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function integrationAlert(message, type='info') {
  const el=document.getElementById('integration-settings-alert');
  if(el) el.innerHTML=`<div class="alert alert-${type}">${syncEscape(message)}</div>`;
}

function integrationToast(message,type='info',duration=4200){
  const wrap=document.getElementById('integration-toast-container');
  if(!wrap)return;
  const toast=document.createElement('div');
  toast.className=`integration-toast ${type}`;
  const icon=type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️';
  toast.innerHTML=`${icon} ${syncEscape(message)}`;
  wrap.appendChild(toast);
  window.setTimeout(()=>toast.remove(),duration);
}

function setActionResult(id,{state='info',title='',summary='',details=[],meta=[]}={}){
  const el=document.getElementById(id);
  if(!el)return;
  const detailItems=(details||[]).filter(Boolean).map(v=>`<li>${syncEscape(String(v))}</li>`).join('');
  const badges=(meta||[]).filter(Boolean).map(v=>`<span class="badge badge-blue">${syncEscape(String(v))}</span>`).join('');
  el.className=`action-result show ${state}`;
  el.innerHTML=`
    <div class="action-result-title">${syncEscape(title||'처리 결과')}</div>
    ${summary?`<div>${syncEscape(summary)}</div>`:''}
    ${badges?`<div class="action-result-meta">${badges}</div>`:''}
    ${detailItems?`<ul class="action-result-details">${detailItems}</ul>`:''}`;
}

function editorStatus(message,type='info'){
  const el=document.getElementById('vcenter-editor-status');
  if(!el)return;
  const prefix=type==='success'?'✅ ':type==='error'?'❌ ':type==='warning'?'⚠️ ':'ℹ️ ';
  el.innerHTML=`${prefix}${syncEscape(message)}`;
}

function setButtonBusy(id,busy,busyText,normalText){
  const button=document.getElementById(id);
  if(!button)return;
  button.disabled=Boolean(busy);
  button.innerHTML=busy?`<span class="loading"></span> ${syncEscape(busyText)}`:syncEscape(normalText);
}

async function integrationFetch(url, options={}){
  try{
    const response=await fetch(url,options);
    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{};}
    catch(_){data={status:'FAILED',stage:'RESPONSE_PARSE',error:`서버 응답을 해석할 수 없습니다. HTTP ${response.status}: ${raw.slice(0,500)}`};}
    data._httpStatus=response.status;
    data._ok=response.ok;
    if(!response.ok&&!data.error)data.error=`HTTP ${response.status} 요청 실패`;
    return data;
  }catch(error){
    return {status:'FAILED',stage:'WAS_API',error:`WAS API 호출 실패: ${error.message||error}`,_httpStatus:0,_ok:false};
  }
}
function closeModal(e) { if(e.target === document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('show');
  setTimeout(()=>{ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }, 200);
}
// ── 초기화 ──
window.addEventListener('load', () => {
  loadHistorySelects();
  initAutoReportDates();
  initResourceUsageDates();
  loadDashboard();
  loadModulePanels();
  const page = '{{ page }}';
  if(page === 'history') loadHistory();
  if(page === 'admin_mapping') { loadMenus(); }
  if(page === 'admin_users') { loadUsers(); }
  if(page === 'asset_sync') { loadAssetSyncDashboard(); }
  if(page === 'integration_settings') { loadIntegrationSettings(); }
  if(page === 'report') { loadResourceUsage(); }
  if(page === 'daily_check') { loadDailyCheck(); }
  if(page === 'weekly_check') { loadWeeklyCheck(); }
  if(page === 'monthly_check') { loadMonthlyCheck(); }
  runPageLoader(page);
  const openModule = PORTAL_MODULES.find(m => m.location === 'REMOTE' && m.page === page);
  if(openModule) loadModulePage(openModule.id);
});

// ── 변경 이벤트 표시 ──
// 서버가 붙여준 표시용 값(old_display/new_display)을 쓴다. 없으면 원래 값으로 돌아간다.
// 값이 길면 세 줄까지만 보이고, 눌러서 전체를 편다.
function changeCell(row, side){
  const display=row[`${side}_display`];
  const fallback=row[`${side}_value`];
  const short=(display!=null&&display!=='')?String(display)
    :(fallback==null||fallback===''?'':String(fallback));
  if(!short)return '<span class="text-muted">-</span>';
  const detail=row.detail?row.detail[side]:null;
  const full=detail==null?short
    :(typeof detail==='string'?detail:JSON.stringify(detail,null,2));
  if(full===short&&short.length<=60)return escapeHtml(short);
  return `<div class="cell-clip" title="눌러서 전체 보기"`
    +` data-short="${escapeHtml(short)}" data-full="${escapeHtml(full)}"`
    +` onclick="toggleCellDetail(this)">${escapeHtml(short)}</div>`;
}

function toggleCellDetail(el){
  const open=el.classList.toggle('open');
  el.textContent=open?el.dataset.full:el.dataset.short;
}

// 필드 이름도 라벨이 있으면 그걸 쓴다.
function changeField(row){
  const label=row.field_label||row.field_name;
  return label?escapeHtml(label):'<span class="text-muted">-</span>';
}

// 자산 대수의 기준 문구. 기준은 관리 → 연계 설정에서 고르고, 서버가 응답에
// 담아 보낸다. 화면에 '운영·대기' 처럼 박아 두면 기준을 바꿔도 문구가 남는다.
function assetBasisLabel(status) {
  const basis = ((status || {}).counting_basis || {}).basis || (status || {}).basis || {};
  return basis.label ? `ITSM 자산 전체 · 기준 ${basis.label}` : 'ITSM 자산 전체';
}

// ── 증감 현황 (서버 한 대 = 한 줄) ───────────────────────────────────
// 증감 현황에서 알아야 할 것은 둘뿐이다. 어떤 서버가 바뀌었나, 그리고 vCenter
// 변경이 ITSM 에도 반영됐나. 한 자산의 변경을 한 줄로 접고, vCenter 줄에는
// 반영 여부를 붙인다.
const DIGEST_KIND_CLASS = {
  CREATED: 'text-success', REMOVED: 'text-error',
  STATUS: 'text-warning', CHANGED: '',
};
const DIGEST_REFLECTION_CLASS = {
  REFLECTED: 'text-success', NOT_REFLECTED: 'text-error',
  NO_ASSET: 'text-warning', NOT_CHECKED: 'text-muted',
};

// 바뀐 항목을 출처별로 묶어 적는다. 한 줄 안에서 ITSM 쪽과 vCenter 쪽이
// 구분돼야 "어디서 바뀐 건지" 를 다시 찾아보지 않는다.
function digestFieldBlock(label, items) {
  if (!items || !items.length) return '';
  return `<div class="text-xs"><span class="text-muted">[${syncEscape(label)}]</span> `
    + items.map(item =>
        `${syncEscape(item.label)} ${syncEscape(item.old)} <strong>→</strong> ${syncEscape(item.new)}`)
      .join(' · ') + '</div>';
}

function digestFields(row) {
  const blocks = digestFieldBlock('ITSM', row.itsm_fields)
    + digestFieldBlock('vCenter', row.vcenter_fields);
  if (!blocks) {
    return row.trivial_count
      ? `<span class="text-muted">뜻 있는 변경 없음 (경미 ${row.trivial_count}건)</span>`
      : `<span class="text-muted">${syncEscape(row.kind_label)}</span>`;
  }
  return blocks + (row.trivial_count
    ? `<div class="text-xs text-muted">경미 ${row.trivial_count}건 숨김</div>` : '');
}

// 지금 값. 통합기 화면에 다시 들어가지 않아도 되도록 한 칸에 모은다.
function digestFacts(row) {
  const pair = (label, itsm, vm) => {
    if (itsm == null && vm == null) return '';
    const both = itsm != null && vm != null;
    // 한쪽이 아예 없는 것은 '다르다' 가 아니다. 짝이 없을 뿐이라 경고하지 않는다.
    const differs = both && Number(itsm) !== Number(vm);
    const text = both && !differs ? Number(itsm).toLocaleString()
      : `ITSM ${itsm == null ? '-' : Number(itsm).toLocaleString()}`
        + ` / vC ${vm == null ? '-' : Number(vm).toLocaleString()}`;
    return `<div class="text-xs${differs ? ' text-warning' : ''}">`
      + `<span class="text-muted">${label}</span> ${text}</div>`;
  };
  const place = [row.vcenter_label, row.cluster_label, row.esxi_label].filter(Boolean).join(' · ');
  return (place ? `<div class="text-xs mono">${syncEscape(place)}</div>` : '')
    + (row.vm_name ? `<div class="text-xs text-muted">VM ${syncEscape(row.vm_name)}</div>` : '')
    + pair('CPU', row.itsm_cpu, row.vm_cpu)
    + pair('MEM(MB)', row.itsm_memory_mb, row.vm_memory_mb)
    || '<span class="text-muted">-</span>';
}

// 이 변경이 서버 대수를 움직이나. 일간에서 본 것이 월간 대수에 왜 잡히고
// 안 잡히는지를 여기서 밝힌다.
function digestCount(row) {
  const effect = Number(row.count_effect || 0);
  const cls = effect > 0 ? 'text-success' : (effect < 0 ? 'text-error' : 'text-muted');
  return `<span class="${cls}"><strong>${syncEscape(row.count_effect_label || '-')}</strong></span>`
    + (row.count_note ? `<div class="text-xs text-muted">${syncEscape(row.count_note)}</div>` : '');
}

function digestReflection(row) {
  if (!row.reflection) return '<span class="text-muted">-</span>';
  const cls = DIGEST_REFLECTION_CLASS[row.reflection] || '';
  return `<span class="${cls}"><strong>${syncEscape(row.reflection_label)}</strong></span>`
    + (row.reflection_note ? `<div class="text-xs text-muted">${syncEscape(row.reflection_note)}</div>` : '')
    + (row.itsm_action ? `<div class="text-xs text-warning">→ ${syncEscape(row.itsm_action)}</div>` : '');
}

// 표 한 벌. 묶음 화면은 구분이 제목에 있으므로 구분 칸을 뺀다.
function digestTableInner(rows, options) {
  const opts = options || {};
  const withKind = opts.withKind !== false;
  const cols = withKind ? 10 : 9;
  // 월간 변동 내역처럼 호스트명 · 업무명 · IP 를 칸으로 나눈다. 한 칸에 몰아 두면
  // 어떤 서버인지 읽기 어렵다.
  return `<thead><tr>
    <th>일시</th>${withKind ? '<th>구분</th>' : ''}<th style="white-space:nowrap">호스트명</th>
    <th style="white-space:nowrap">업무명</th><th>IP</th>
    <th style="white-space:nowrap">자산번호 · 상태</th><th>지금 값 · 통합기</th>
    <th>바뀐 내용</th><th>ITSM 반영</th><th>서버 대수</th>
  </tr></thead><tbody>${
    rows.length ? rows.map(row => `<tr>
      <td class="text-xs">${syncEscape(String(row.detected_at || '').slice(0, 16).replace('T', ' '))}
        <div class="text-xs text-muted">${syncEscape((row.sources || []).map(
          s => s === 'ITSM' ? 'ITSM' : 'vCenter').join(' + ') || '-')}</div></td>
      ${withKind ? `<td class="${DIGEST_KIND_CLASS[row.kind] || ''}"><strong>${syncEscape(row.kind_label)}</strong></td>` : ''}
      <td style="min-width:110px"><strong>${syncEscape(row.hostname || row.vm_name || '-')}</strong>${missingBadge(row.missing)}</td>
      <td>${syncEscape(row.service_name || '-')}</td>
      <td class="text-xs mono" style="white-space:nowrap">${syncEscape(row.primary_ip || '-')}</td>
      <td class="text-xs" style="white-space:nowrap"><span class="mono">${syncEscape(row.itsm_cm_id || row.vm_key || '-')}</span>
        ${row.itsm_status_label ? `<div class="text-muted">${syncEscape(row.itsm_status_label)}</div>` : ''}</td>
      <td>${digestFacts(row)}</td>
      <td class="text-xs">${digestFields(row)}</td>
      <td class="text-xs">${digestReflection(row)}</td>
      <td class="text-xs">${digestCount(row)}</td>
    </tr>`).join('')
      : `<tr><td colspan="${cols}" style="text-align:center" class="text-muted">${
        syncEscape(opts.empty || '이 기간에 바뀐 서버가 없습니다.')}</td></tr>`
  }</tbody>`;
}

// EOSL 현황 조사에 필요한 ITSM 값이 빈 것. 일 · 주 · 월 화면이 같은 표시를 쓴다.
function missingBadge(missing) {
  if (!missing || !missing.length) return '';
  return `<div class="text-xs text-warning" title="ITSM 에 채워야 EOSL · OS 현황에 바르게 잡힙니다">`
    + `⚠ 필수 정보 누락: ${syncEscape(missing.join(', '))}</div>`;
}

// rows 를 그대로 받아 그린다. 걸러내기는 부르는 쪽이 한다.
function renderChangeDigest(tableId, rows, options) {
  const table = document.getElementById(tableId);
  if (!table) return;
  table.className = 'table-sticky';
  table.innerHTML = digestTableInner(rows, options);
}

// [생성] → [변경] → [삭제] 로 묶어 그린다. 보고 형식 그대로다.
// ITSM 상태가 집계 기준 안으로 들어오면 생성, 밖으로 나가면 삭제로 이미
// 분류돼 온다 -- 화면은 서버가 정한 kind 를 그대로 묶기만 한다.
const DIGEST_SECTIONS = [['CREATED', '생성'], ['CHANGED', '변경'], ['REMOVED', '삭제']];

function renderChangeDigestGroups(holderId, rows, options) {
  const holder = document.getElementById(holderId);
  if (!holder) return;
  const opts = options || {};
  const only = opts.kind && opts.kind !== 'all' ? opts.kind : null;
  holder.innerHTML = DIGEST_SECTIONS.filter(([kind]) => !only || kind === only).map(([kind, label]) => {
    const items = (rows || []).filter(row => row.kind === kind);
    const net = items.reduce((sum, row) => sum + Number(row.count_effect || 0), 0);
    const pending = items.filter(row => row.reflection === 'NOT_REFLECTED').length;
    const notes = [];
    if (kind !== 'CHANGED') notes.push(`운영 대수 ${net > 0 ? '+' : (net < 0 ? '−' : '')}${Math.abs(net)}`);
    if (pending) notes.push(`ITSM 미반영 ${pending}건`);
    return `<div style="margin-bottom:18px">
      <div class="flex items-center gap-2" style="margin-bottom:6px">
        <span class="${DIGEST_KIND_CLASS[kind] || ''}" style="font-weight:700;font-size:15px">[${label}] 총 ${items.length.toLocaleString()}건</span>
        ${notes.length ? `<span class="text-xs text-muted">${syncEscape(notes.join(' · '))}</span>` : ''}
      </div>
      ${items.length
        ? `<div class="table-wrap" style="max-height:420px;overflow:auto"><table class="table-sticky">${
            digestTableInner(items, {withKind: false})}</table></div>`
        : `<div class="text-xs text-muted" style="padding:6px 2px">${syncEscape(opts.empty || '없음')}</div>`}
    </div>`;
  }).join('');
}

// ── 자산 생성 · 삭제 내역 (주간 · 월간 공용) ──
// 순증감 숫자만 보면 "+2" 가 "3대 늘고 1대 빠짐" 인지 알 수 없다. 식으로 풀어 쓰고,
// 그 아래에 어느 서버인지를 일간 보고와 같은 [생성] · [삭제] 묶음으로 적는다.
// 칸은 자산 대수를 눌렀을 때 보이는 정보(자산번호 · 호스트명 · IP · 업무명 …)와 같다.
const MOVEMENT_SECTIONS = [['created', '생성', 'text-success'], ['changed', '변경', ''], ['removed', '삭제', 'text-error']];

function movementMatches(item, term) {
  if (!term) return true;
  return [item.cm_id, item.hostname, item.primary_ip, item.service_name, item.os_family,
    item.os_group, item.location, item.reason]
    .some(v => String(v || '').toLowerCase().includes(term));
}

function movementEquation(movements, previousLabel) {
  // 대수는 ITSM 기준이다. vCenter 만 바뀐 줄(대수 그대로)은 식에서 뺀다.
  const pick = block => Number((block || {}).counted != null ? block.counted : (block || {}).total || 0);
  const created = pick((movements || {}).created);
  const removed = pick((movements || {}).removed);
  const net = movements.net != null ? Number(movements.net) : created - removed;
  const sign = net > 0 ? '+' : (net < 0 ? '−' : '±');
  const before = movements.before_total != null
    ? `${syncEscape(previousLabel || '이전')} ${Number(movements.before_total).toLocaleString()}대 → 지금 ${Number(movements.after_total).toLocaleString()}대 · ` : '';
  return `<div class="text-sm" style="margin-bottom:12px">${before}순증감 <strong>${sign}${Math.abs(net).toLocaleString()}대</strong>
    = <span class="text-success"><strong>생성 ${created.toLocaleString()}대</strong></span>
    − <span class="text-error"><strong>삭제 ${removed.toLocaleString()}대</strong></span>
    <span class="text-xs text-muted">(대수에 반영된 것만)</span></div>`;
}

// ITSM 에 반영됐나. ITSM 쪽에서 바뀐 줄은 반영된 것이고, vCenter 만 바뀐 줄은 지금 ITSM 과 견준다.
function movementReflection(item) {
  if (item.source !== 'VCENTER') return '<span class="text-success"><strong>반영됨</strong></span><div class="text-muted">ITSM 에서 바뀜</div>';
  const ok = item.itsm_reflection_ok;
  return `<span class="${ok ? 'text-success' : 'text-warning'}"><strong>${syncEscape(item.itsm_reflection || '-')}</strong></span>`
    + (item.itsm_action ? `<div class="text-warning">→ ${syncEscape(item.itsm_action)}</div>` : '')
    + (item.reflection_note ? `<div class="text-muted">${syncEscape(item.reflection_note)}</div>` : '');
}

function movementCount(item) {
  const effect = Number(item.count_effect || 0);
  if (!effect) return '<span class="text-muted"><strong>그대로</strong></span><div class="text-muted">ITSM 이 바뀌어야 움직임</div>';
  return `<span class="${effect > 0 ? 'text-success' : 'text-error'}"><strong>${effect > 0 ? '+1' : '−1'}</strong></span>`;
}

function renderAssetMovementGroups(holderId, movements, options) {
  const holder = document.getElementById(holderId);
  if (!holder) return {shown: 0, total: 0};
  const opts = options || {};
  if (!movements) {
    holder.innerHTML = `<div class="text-muted text-sm">${syncEscape(opts.empty || '비교할 이전 스냅샷이 없습니다.')}</div>`;
    return {shown: 0, total: 0};
  }
  const term = String(opts.term || '').trim().toLowerCase();
  let shownCount = 0, totalCount = 0;
  const sections = MOVEMENT_SECTIONS.map(([key, label, cls]) => {
    const all = ((movements[key] || {}).items) || [];
    const items = all.filter(item => movementMatches(item, term));
    shownCount += items.length; totalCount += all.length;
    const body = items.map(item => `<tr>
        <td class="mono text-xs" style="white-space:nowrap">${syncEscape(item.changed_on || '-')}</td>
        <td class="text-xs mono" style="white-space:nowrap">${syncEscape(item.cm_id || '-')}</td>
        <td style="min-width:110px"><strong style="white-space:nowrap">${syncEscape(item.hostname || '(호스트명 없음)')}</strong>${missingBadge(item.missing)}</td>
        <td class="text-xs mono" style="white-space:nowrap">${syncEscape(item.primary_ip || '-')}</td>
        <td>${syncEscape(item.service_name || '-')}</td>
        <td>${syncEscape(item.location || '-')}</td>
        <td>${syncEscape(item.kind || '-')}</td>
        <td>${syncEscape(item.os_group || '-')}
          ${item.os_version ? `<div class="text-xs text-muted">${syncEscape(item.os_family || '')} ${syncEscape(item.os_version)}</div>` : ''}</td>
        <td>${item.eosl_year == null ? '<span class="text-muted">미사용</span>' : syncEscape(String(item.eosl_year))}</td>
        <td class="text-xs">${syncEscape(item.status_label || item.status_code || '-')}</td>
        <td class="text-xs">${syncEscape(item.reason || '-')}
          ${item.vcenter_note ? `<div class="text-muted">${syncEscape(item.vcenter_note)}</div>` : ''}</td>
        <td class="text-xs">${movementReflection(item)}</td>
        <td class="text-xs">${movementCount(item)}</td>
        ${opts.excludable ? `<td>${key === 'created' && item.source !== 'VCENTER'
          ? `<button class="btn btn-secondary btn-sm" onclick="excludeOneAsset('${syncEscape(item.cm_id)}','${syncEscape(item.hostname || '')}')">제외</button>` : ''}</td>` : ''}
      </tr>`).join('');
    const head = `<tr><th>날짜</th><th>자산번호</th><th>호스트명</th><th>IP</th><th>업무명</th><th>위치</th>
      <th>물리/논리</th><th>OS</th><th>EOSL</th><th>${key === 'removed' ? '삭제 전 상태' : '상태'}</th><th>사유</th>
      <th style="white-space:nowrap">ITSM 반영</th><th style="white-space:nowrap">대수 반영</th>${opts.excludable ? '<th></th>' : ''}</tr>`;
    return `<div style="margin-bottom:18px">
      <div class="flex items-center gap-2" style="margin-bottom:6px">
        <span class="${cls}" style="font-weight:700;font-size:15px">[${label}] 총 ${all.length.toLocaleString()}건</span>
        <span class="text-xs text-muted">${key === 'changed'
          ? '기간 중 바뀌었다가 처음 상태로 돌아온 서버(꺼짐→켜짐 등). 서버 상태는 그대로라 생성 · 삭제에 넣지 않습니다'
          : `대수 반영 ${Number((movements[key] || {}).counted ?? all.length)}건
          · vCenter 만 바뀜(대수 그대로) ${Number((movements[key] || {}).vcenter_only || 0)}건`}</span>
        ${term && items.length !== all.length ? `<span class="text-xs text-muted">검색으로 ${items.length}대 표시</span>` : ''}
      </div>
      ${items.length
        ? `<div class="table-wrap" style="max-height:420px;overflow:auto"><table class="table-sticky"><thead>${head}</thead><tbody>${body}</tbody></table></div>`
        : `<div class="text-xs text-muted" style="padding:6px 2px">${all.length ? '검색 결과가 없습니다.' : '없음'}</div>`}
    </div>`;
  }).join('');
  holder.innerHTML = movementEquation(movements, opts.previousLabel)
    + `<div class="text-xs text-muted" style="margin:-6px 0 12px">서버 대수는 <strong>ITSM 기준</strong>입니다. vCenter 에서만 생기거나
       사라진 서버(전원 켜짐 · 꺼짐 포함)도 [생성] · [삭제] 에 넣되 대수는 그대로이고, <strong>ITSM 반영</strong> 칸에
       볼 때마다 지금 ITSM 과 다시 견준 결과를 적습니다. <strong>서버 1대는 생성 · 변경 · 삭제 중 한 곳에만</strong> 나옵니다
       (기간의 처음과 끝을 견줌).</div>`
    + sections;
  return {shown: shownCount, total: totalCount};
}

// ── 서버 판정 추적: 왜 생성 · 삭제로 잡혔(안 잡혔)나 ──
// 날마다 ITSM 에 어떤 상태로 수집됐고 그 상태가 집계 기준에 들었는지, 수동 규칙 · 수집 결과 ·
// VM 전원까지 모아 결론 한 줄을 보여준다. 추측 대신 근거로 답하기 위한 것이다.
const TRACE_LEVEL = {ok: 'alert-success', info: 'alert-info', warn: 'alert-warning', error: 'alert-error'};

async function runAssetTrace(inputId, holderId, start, end) {
  const holder = document.getElementById(holderId);
  const q = ((document.getElementById(inputId) || {}).value || '').trim();
  if (!holder) return;
  if (!q) { holder.innerHTML = '<div class="text-xs text-muted">자산번호 · 호스트명 · IP 중 하나를 적어 주세요.</div>'; return; }
  holder.innerHTML = '<div class="text-sm text-muted"><span class="loading"></span> 판정 근거를 모으는 중...</div>';
  const res = await integrationFetch(`/api/asset-sync/asset-trace?q=${encodeURIComponent(q)}&start=${start}&end=${end}`);
  if (res.status !== 'SUCCESS') {
    holder.innerHTML = `<div class="alert alert-warning">${syncEscape(res.message || res.error || '찾지 못했습니다.')}</div>`;
    return;
  }
  holder.innerHTML = res.assets.map(asset => {
    const rule = asset.manual_rule ? `<div class="text-xs text-warning">수동 규칙: ${syncEscape(asset.manual_rule.mode === 'INCLUDE' ? '포함' : '제외')}
      ${asset.manual_rule.reason ? '— ' + syncEscape(asset.manual_rule.reason) : ''}</div>` : '';
    const timeline = asset.timeline.map(t => `<tr>
        <td class="mono text-xs">${syncEscape(t.date)}${t.until !== t.date ? ' ~ ' + syncEscape(t.until) : ''}${t.baseline ? ' <span class="text-muted">(기간 전)</span>' : ''}</td>
        <td>${syncEscape(t.status_label)}</td>
        <td class="${t.counted ? 'text-success' : 'text-muted'}"><strong>${t.counted ? '자산으로 셈' : '안 셈'}</strong>
          ${t.reason ? `<div class="text-xs text-muted">${syncEscape(t.reason)}</div>` : ''}</td>
        <td class="text-xs text-warning">${syncEscape(t.held || '')}</td></tr>`).join('');
    const events = (asset.events || []).map(e => `${syncEscape(String(e.at || '').slice(0, 10))} ${syncEscape(e.text)}`).join(' · ');
    const vm = (asset.vm || []).map(v => `${syncEscape(v.date)}${v.until !== v.date ? '~' + syncEscape(v.until) : ''} ${syncEscape(v.vm_name || '')} ${syncEscape(v.power)}`).join(' · ');
    return `<div class="result-box" style="margin-top:8px">
      <div style="margin-bottom:6px"><strong>${syncEscape(asset.hostname || '-')}</strong>
        <span class="text-xs mono text-muted">${syncEscape(asset.cm_id)} · ${syncEscape(asset.ip || '')}</span>
        <span class="text-xs text-muted">${syncEscape(asset.service_name || '')}</span></div>
      <div class="alert ${TRACE_LEVEL[asset.verdict.level] || 'alert-info'}" style="margin-bottom:8px">${syncEscape(asset.verdict.text)}</div>
      ${rule}
      <div class="table-wrap"><table><thead><tr><th>ITSM 수집일</th><th>상태</th><th>집계 기준(${syncEscape((res.basis || {}).label || '')})</th><th>수집 참고</th></tr></thead>
        <tbody>${timeline}</tbody></table></div>
      <div class="text-xs text-muted" style="margin-top:6px">ITSM 변경 기록: ${events || '없음'}</div>
      <div class="text-xs text-muted">vCenter VM: ${vm || '같은 호스트명 · IP 의 VM 없음'}</div>
    </div>`;
  }).join('') + (res.more ? '<div class="text-xs text-muted">더 있습니다. 자산번호로 좁혀 찾아 주세요.</div>' : '');
}

// ITSM 에 아직 반영 안 된 것이 있으면 표 위에 띄운다. 표 안에 섞어 두면
// 스크롤 아래로 묻힌다 -- 묻히면 반영도 안 된다. 눌러서 그것만 볼 수 있게 한다.
function renderDigestPendingNotice(holderId, digest, options) {
  const holder = document.getElementById(holderId);
  if (!holder) return;
  const opts = options || {};
  const pending = Number(((digest || {}).summary || {}).itsm_pending || 0);
  if (!pending) { holder.innerHTML = ''; return; }
  const rows = ((digest || {}).rows || []).filter(r => r.reflection === 'NOT_REFLECTED');
  const actions = {};
  rows.forEach(r => { if (r.itsm_action) actions[r.itsm_action] = (actions[r.itsm_action] || 0) + 1; });
  const breakdown = Object.keys(actions).sort()
    .map(key => `${syncEscape(key)} ${actions[key]}건`).join(' · ');
  holder.innerHTML = `<div class="alert alert-warning">
    <div class="flex justify-between items-center gap-2">
      <div>
        <strong>ITSM 에 반영이 안 된 변경 ${pending.toLocaleString()}건</strong>
        <div class="text-xs">vCenter 에서는 바뀌었는데 ITSM 자산 정보는 그대로입니다.
          ${breakdown ? '해야 할 일: ' + breakdown : ''}</div>
      </div>
      <div class="flex gap-2">
        ${opts.onShow ? `<button class="btn btn-secondary btn-sm" onclick="${opts.onShow}">미반영만 보기</button>` : ''}
        ${opts.onExport ? `<button class="btn btn-primary btn-sm" onclick="${opts.onExport}">반영 목록 내려받기</button>` : ''}
      </div>
    </div></div>`;
}

// 화면이 고른 조건대로 걸러낸다. 분류·출처·검색·ITSM 미반영만.
function filterDigestRows(rows, filter) {
  const want = filter || {};
  const term = String(want.q || '').trim().toLowerCase();
  return (rows || []).filter(row => {
    if (want.kind && want.kind !== 'all' && row.kind !== want.kind) return false;
    // 한 줄이 ITSM·vCenter 양쪽을 담으므로 '그 출처가 섞여 있는가' 로 본다.
    if (want.source && !(row.sources || []).includes(want.source)) return false;
    if (want.pending && row.reflection !== 'NOT_REFLECTED') return false;
    // 대수를 움직인 것만 보기. 월간 대수와 맞대어 볼 때 쓴다.
    if (want.counting && !Number(row.count_effect || 0)) return false;
    if (!term) return true;
    const hay = [row.label, row.hostname, row.primary_ip, row.asset_key, row.vm_key,
                 row.vm_name, row.esxi_host, row.esxi_label, row.cluster_label,
                 row.vcenter_label, row.summary, row.itsm_cm_id, row.reflection_note];
    return hay.some(v => String(v || '').toLowerCase().includes(term));
  });
}

// fold='period' 면 기간 동안 서버 1대 = 1줄(생성 · 삭제 · 변경 중 한 곳). 주간이 쓴다.
async function loadChangeDigest(start, end, source, fold) {
  const query = new URLSearchParams({start, end});
  if (source) query.set('source', source);
  if (fold) query.set('fold', fold);
  return apiFetch('/api/asset-sync/change-digest?' + query);
}

async function exportChangeDigest(start, end, options) {
  const opts = options || {};
  const query = new URLSearchParams({start, end});
  if (opts.source) query.set('source', opts.source);
  if (opts.pending) query.set('pending', '1');
  if (opts.fold) query.set('fold', opts.fold);
  const response = await fetch('/api/asset-sync/change-digest/export?' + query);
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    return {ok: false, error: data.error || `HTTP ${response.status}`};
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const disposition = response.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  link.href = url;
  link.download = match ? decodeURIComponent(match[1]) : '증감현황.xlsx';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  return {ok: true};
}

// ── 수집 상태 알림 ───────────────────────────────────────────────────
// 통합기 일부가 실패하면 VM 대수는 줄어든다. 그걸 모르면 화면만 보고 "VM 이
// 삭제됐다" 고 읽는다. 어느 통합기가 빠졌는지 일간·주간·월간에서 같은 모양으로
// 띄운다. 성공한 통합기의 추가·삭제는 그대로 반영된 값이라는 점도 적는다.
let collectionHealthCache = null;

async function loadCollectionHealth(force){
  if(collectionHealthCache && !force) return collectionHealthCache;
  try{
    collectionHealthCache = await apiFetch('/api/asset-sync/collection-health');
  }catch(error){
    collectionHealthCache = {status:'UNKNOWN', reasons:[], scopes:{}};
  }
  return collectionHealthCache;
}

function renderCollectionNotice(elementId, health){
  const el = document.getElementById(elementId);
  if(!el) return;
  const info = health || {};
  const failed = (info.scopes && info.scopes.failed) || [];
  const reasons = info.reasons || [];
  if(info.status === 'SUCCESS' || info.status === 'NO_RUN' || info.status === 'UNKNOWN'){
    if(!failed.length && !reasons.length){ el.innerHTML = ''; return; }
  }
  const lines = [];
  if(failed.length){
    lines.push(`수집에 실패한 통합기 <strong>${failed.length.toLocaleString()}개</strong>: `
      + `<span class="mono">${failed.map(syncEscape).join(', ')}</span>`);
    lines.push('이 통합기의 VM 은 <strong>삭제가 아니라 수집공백</strong>으로 표시됩니다. '
      + '나머지 통합기의 추가·삭제는 그대로 반영된 값입니다.');
  }
  reasons.filter(r => r && r.code !== 'SCOPE_FAILED')
    .forEach(r => lines.push(`[${syncEscape(r.area||'')}] ${syncEscape(r.message||'')}`));
  if(!lines.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="alert alert-warning">`
    + `<strong>마지막 자동 수집: ${syncEscape(info.status||'-')}</strong>`
    + ` <span class="text-xs text-muted">${dashboardDateText(info.ended_at||info.started_at)}</span>`
    + `<div class="text-xs" style="margin-top:6px">${lines.join('<br>')}</div></div>`;
}

async function showCollectionNotice(elementId, force){
  renderCollectionNotice(elementId, await loadCollectionHealth(force));
}
</script>
