{# 일간 · 주간 점검 스크립트 #}
<script>
// ── 일간 점검 ──
// 대시보드가 이미 만들어 둔 집계(/api/asset-sync/dashboard)와 전일 대비 비교를 쓴다.
// 새로 계산하지 않으므로 화면만 옮겨온 셈이다.
async function loadDailyCheck() {
  const alertEl = document.getElementById('daily-check-alert');
  if (!alertEl) return;
  alertEl.innerHTML = '<div class="alert alert-info"><span class="loading"></span> 일간 점검 자료를 불러오는 중...</div>';
  try {
    const [summary, itsm, vcenter] = await Promise.all([
      apiFetch('/api/asset-sync/dashboard'),
      apiFetch('/api/asset-sync/daily-comparison?source=ITSM&limit=500'),
      apiFetch('/api/asset-sync/daily-comparison?source=RVTOOLS&limit=500'),
    ]);
    alertEl.innerHTML = '';
    renderDailyComposition(summary);
    renderDailyChanges('itsm', itsm);
    renderDailyChanges('vcenter', vcenter);
    // 통합기 일부가 실패했으면 왜 대수가 적은지 여기서 알려준다.
    showCollectionNotice('daily-collection-notice', true);
  } catch (error) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(error.message)}</div>`;
  }
  // 위 두 표는 건수를 센다. 어떤 서버가 바뀌었는지는 아래 묶은 표에서 본다.
  loadDailyDigest();
}

// ── 일간 증감 현황 (서버 한 대 = 한 줄) ──
// 묶기와 ITSM 반영 판정은 서버가 한다(/api/asset-sync/change-digest).
let dailyDigest = null;
let dailyDigestDate = null;          // 'YYYY-MM-DD'
let dailyDigestFallback = null;      // 오늘 대신 보여 준 날

function todayDate() { return localDate(new Date()); }

function shiftDailyDigest(step) {
  const base = new Date(`${dailyDigestDate || todayDate()}T00:00:00`);
  base.setDate(base.getDate() + step);
  loadDailyDigest(localDate(base));
}

async function loadDailyDigest(day) {
  const table = document.getElementById('daily-digest-groups');
  if (!table) return;
  const basis = document.getElementById('daily-digest-basis');
  const picked = day || dailyDigestDate || todayDate();
  const input = document.getElementById('daily-digest-date');
  dailyDigestDate = picked;
  dailyDigestFallback = null;
  if (input) input.value = picked;
  if (basis) basis.innerHTML = '<span class="loading"></span> 변경된 서버를 묶는 중...';

  let digest = await loadChangeDigest(`${picked}T00:00:00`, `${picked}T23:59:59`)
    .catch(error => ({error: error.message}));
  // 오늘인데 아직 비어 있으면 가장 최근 변경일로 물러난다. 배치는 밤에 돌고
  // 사람은 아침에 본다 -- 빈 화면만 보여주면 배치가 죽은 것처럼 보인다.
  if (digest && !digest.error && !(digest.rows || []).length && picked === todayDate()) {
    const from = new Date(`${picked}T00:00:00`);
    from.setDate(from.getDate() - 14);
    const wide = await loadChangeDigest(`${localDate(from)}T00:00:00`, `${picked}T23:59:59`)
      .catch(() => null);
    const latest = latestDigestDay(wide);
    if (latest && latest !== picked) {
      dailyDigestFallback = picked;
      dailyDigestDate = latest;
      if (input) input.value = latest;
      digest = await loadChangeDigest(`${latest}T00:00:00`, `${latest}T23:59:59`)
        .catch(error => ({error: error.message}));
    }
  }
  dailyDigest = digest;
  renderDailyDigest();
}

// 받아 둔 묶음에서 변경이 있는 가장 최근 날짜를 고른다.
function latestDigestDay(digest) {
  const days = ((digest && digest.rows) || [])
    .map(row => String(row.day || '').slice(0, 10)).filter(Boolean).sort();
  return days.length ? days[days.length - 1] : null;
}

function renderDailyDigest() {
  const table = document.getElementById('daily-digest-groups');
  const basis = document.getElementById('daily-digest-basis');
  if (!table) return;
  if (dailyDigest && dailyDigest.error) {
    renderChangeDigestGroups('daily-digest-groups', [], {empty: '변경 내역을 불러오지 못했습니다.'});
    if (basis) basis.textContent = dailyDigest.error;
    return;
  }
  const rows = (dailyDigest && dailyDigest.rows) || [];
  const bucket = (document.getElementById('daily-digest-filter') || {}).value || 'all';
  const kind = {created: 'CREATED', removed: 'REMOVED', changed: 'CHANGED'}[bucket] || 'all';
  const shown = filterDigestRows(rows, {
    kind,
    source: (document.getElementById('daily-digest-source') || {}).value,
    q: (document.getElementById('daily-digest-search') || {}).value,
    pending: (document.getElementById('daily-digest-pending') || {}).checked,
    effect: (document.getElementById('daily-digest-effect') || {}).value,
  });
  renderChangeDigestGroups('daily-digest-groups', shown, {kind, empty: '없음'});
  renderDailyPowerBox(rows);
  renderDigestPendingNotice('daily-digest-pending-notice', dailyDigest,
    {onShow: 'showDailyPending()', onExport: 'exportDailyPending()'});

  if (basis) {
    const summary = (dailyDigest && dailyDigest.summary) || {};
    const note = dailyDigestFallback
      ? `${dailyDigestFallback} 에는 아직 변경이 없어 가장 최근 변경일 ${dailyDigestDate} 을 보여줍니다. `
      : '';
    basis.textContent = note + (rows.length
      ? `${dailyDigestDate} · 서버 ${Number(summary.servers || 0).toLocaleString()}대`
        + ` · 줄 ${rows.length.toLocaleString()}개 (표시 ${shown.length.toLocaleString()})`
        + (summary.itsm_pending ? ` · ITSM 미반영 ${Number(summary.itsm_pending).toLocaleString()}건` : '')
        + (summary.missing_required ? ` · ⚠ 필수 정보 누락 ${Number(summary.missing_required).toLocaleString()}대` : '')
        + digestCountBasis(summary)
        + (summary.trivial_hidden ? ` · 경미 ${Number(summary.trivial_hidden).toLocaleString()}건 숨김` : '')
      : `${dailyDigestDate} 에 바뀐 서버가 없습니다.`);
  }
}

// ── 전원이 바뀐 VM: 지금 상태 보기 ──
// 아침 배치 때 꺼져 있던 VM 이 업무 시간엔 켜져 있는 일이 있다. 전원이 바뀐 VM 만
// 골라, 그 VM 의 통합기 1대에만 붙어 지금 상태를 읽는다(서버가 통합기를 정한다).
const POWER_TEXT = {poweredon: '켜짐', poweredoff: '꺼짐', suspended: '일시중지'};
let dailyPowerRows = [];

function powerText(value) {
  const key = String(value || '').replace(/[_\s]/g, '').toLowerCase();
  return POWER_TEXT[key] || key || '-';
}

function powerChangedRows(rows) {
  return (rows || []).filter(row => row.vm_key && (
    (row.event_types || []).some(t => t === 'RV_POWER_ON' || t === 'RV_POWER_OFF')
    || (row.fields || []).some(f => f.name === 'power_state')));
}

function renderDailyPowerBox(rows) {
  const holder = document.getElementById('daily-power-now');
  if (!holder) return;
  dailyPowerRows = powerChangedRows(rows);
  if (!dailyPowerRows.length) { holder.innerHTML = ''; return; }
  const on = dailyPowerRows.filter(r => (r.event_types || []).includes('RV_POWER_ON')).length;
  const off = dailyPowerRows.filter(r => (r.event_types || []).includes('RV_POWER_OFF')).length;
  const vcenters = new Set(dailyPowerRows.map(r => r.vcenter_label || r.vcenter_id || '-'));
  holder.innerHTML = `<div class="result-box">
    <div class="flex justify-between items-center gap-2" style="flex-wrap:wrap">
      <div><strong>⚡ 전원이 바뀐 VM ${dailyPowerRows.length}대</strong>
        <span class="text-xs text-muted">(꺼짐→켜짐 ${on} · 켜짐→꺼짐 ${off} · 통합기 ${vcenters.size}곳)
        아침 배치 시점 값입니다. 낮에는 다를 수 있습니다.</span></div>
      <button class="btn btn-primary btn-sm" id="btn-daily-power-now" onclick="loadDailyPowerNow()">현재 VM 상태 보기</button>
    </div>
    <div id="daily-power-now-result" style="margin-top:10px"></div>
  </div>`;
}

function powerTimingText(vc) {
  const ok = (vc.attempts || []).find(a => a.status === 'SUCCESS');
  const failed = (vc.attempts || []).filter(a => a.status === 'FAILED');
  const names = {module: '모듈 로딩', connect: '접속', query: '조회', process: '프로세스'};
  const steps = ok ? ['module', 'connect', 'query', 'process'].filter(k => (ok.timings || {})[k] != null)
    .map(k => `${names[k]} ${ok.timings[k]}s`).join(' · ') : '';
  const fallback = failed.length ? ` (먼저 ${failed.map(a => a.method).join('·')} 실패: ${failed[0].error})` : '';
  return `${syncEscape(vc.vcenter_label || vc.vcenter_id)} — ${ok ? `${ok.method} ${vc.seconds}s` : `실패 ${vc.seconds}s`}`
    + `${steps ? ` [${syncEscape(steps)}]` : ''}${syncEscape(fallback)}`;
}

async function loadDailyPowerNow() {
  const out = document.getElementById('daily-power-now-result');
  if (!out || !dailyPowerRows.length) return;
  setButtonBusy('btn-daily-power-now', true, '통합기에 묻는 중...', '현재 VM 상태 보기');
  out.innerHTML = '<div class="text-sm text-muted"><span class="loading"></span> 그 VM 이 있는 통합기에만 붙어 지금 전원을 읽습니다...</div>';
  const started = performance.now();
  const res = await integrationFetch('/api/asset-sync/vm-power-now', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({vm_keys: dailyPowerRows.map(r => r.vm_key)}),
  });
  setButtonBusy('btn-daily-power-now', false, '', '현재 VM 상태 보기');
  const waited = ((performance.now() - started) / 1000).toFixed(1);
  if (!res.results) {
    out.innerHTML = `<div class="alert alert-error">${syncEscape(res.error || '조회하지 못했습니다.')}</div>`;
    return;
  }
  const byKey = {};
  res.results.forEach(r => { byKey[r.vm_key] = r; });
  const changed = res.results.filter(r => r.found && !r.same).length;
  const body = dailyPowerRows.map(row => {
    const live = byKey[row.vm_key] || {};
    const field = (row.fields || []).find(f => f.name === 'power_state');
    const verdict = !live.found
      ? `<span class="text-error">${syncEscape(live.error || '찾지 못함')}</span>`
      : (live.same ? '<span class="text-muted">아침과 같음</span>'
                   : '<span class="text-warning"><strong>아침과 다름</strong></span>');
    return `<tr>
      <td><strong>${syncEscape(row.hostname || row.label || '-')}</strong>
        <div class="text-xs text-muted">${syncEscape(row.primary_ip || '')} ${row.itsm_cm_id ? '· ' + syncEscape(row.itsm_cm_id) : ''}</div></td>
      <td>${syncEscape(live.vm_name || row.vm_name || row.vm_key)}</td>
      <td class="text-xs">${syncEscape(row.vcenter_label || row.vcenter_id || '-')}</td>
      <td class="text-xs">${field ? `${syncEscape(powerText(field.old))} → ${syncEscape(powerText(field.new))}` : '-'}</td>
      <td>${syncEscape(powerText(live.batch_power || row.power_state))}</td>
      <td><strong>${live.found ? syncEscape(powerText(live.now_power)) : '-'}</strong></td>
      <td>${verdict}</td>
    </tr>`;
  }).join('');
  out.innerHTML = `
    <div class="text-sm" style="margin-bottom:6px">지금 기준 · 아침과 다른 VM <strong>${changed}대</strong>
      · 화면에서 기다린 시간 <strong>${waited}초</strong></div>
    <div class="text-xs text-muted" style="margin-bottom:8px">${(res.vcenters || []).map(powerTimingText).join('<br>')}</div>
    <div class="table-wrap" style="max-height:360px;overflow:auto"><table class="table-sticky">
      <thead><tr><th>서버</th><th>VM</th><th>통합기</th><th>아침 배치 변경</th><th>아침 상태</th><th>지금 상태</th><th>비교</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

// 대수 효과 한 줄. 일간에서 본 증감이 월간 서버 대수에 얼마나 들어가는지를
// 같은 자리에서 읽게 한다 -- 세 화면이 따로 노는 것처럼 보이던 지점이다.
function digestCountBasis(summary) {
  const added = Number(summary.count_added || 0), removed = Number(summary.count_removed || 0);
  const neutral = Number(summary.count_neutral || 0), net = Number(summary.count_net || 0);
  if (!added && !removed && !neutral) return '';
  return ` · 서버 대수 ${net > 0 ? '+' : ''}${net.toLocaleString()}`
    + ` (늘어남 ${added.toLocaleString()} · 줄어듦 ${removed.toLocaleString()}`
    + `${neutral ? ` · 대수와 무관 ${neutral.toLocaleString()}` : ''})`;
}

// 미반영만 보기 -- 걸러내기를 사람이 다시 맞추지 않게 한다.
function showDailyPending() {
  const box = document.getElementById('daily-digest-pending');
  const kind = document.getElementById('daily-digest-filter');
  const source = document.getElementById('daily-digest-source');
  if (box) box.checked = true;
  if (kind) kind.value = 'all';
  if (source) source.value = '';
  renderDailyDigest();
}

async function exportDailyDigest(pendingOnly) {
  const alertEl = document.getElementById('daily-check-alert');
  const day = dailyDigestDate || todayDate();
  const pending = pendingOnly === undefined
    ? (document.getElementById('daily-digest-pending') || {}).checked
    : pendingOnly;
  const result = await exportChangeDigest(`${day}T00:00:00`, `${day}T23:59:59`, {pending});
  if (!result.ok && alertEl) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(result.error)}</div>`;
  }
}

// ITSM 담당자에게 넘길 목록. 미반영만 담긴 파일이 떨어진다.
function exportDailyPending() { return exportDailyDigest(true); }

function renderDailyComposition(summary) {
  const status = summary.asset_status || {};
  const category = status.category || {}, location = status.location || {};
  const physical = Number(category['물리'] || 0), logical = Number(category['논리'] || 0);
  document.getElementById('daily-total').textContent = dashboardNumber(status.total);
  const totalLabel = document.getElementById('daily-total-label');
  if (totalLabel) totalLabel.textContent = assetBasisLabel(status);
  document.getElementById('daily-physical').textContent = dashboardNumber(physical);
  document.getElementById('daily-logical').textContent = dashboardNumber(logical);
  document.getElementById('daily-idc-dr').textContent =
    `${dashboardNumber(location.IDC)} / ${dashboardNumber(location.DR)}`;
  document.getElementById('daily-as-of').textContent =
    summary.as_of ? new Date(summary.as_of).toLocaleString('ko-KR') : '스냅샷 없음';

  document.getElementById('daily-category-total').textContent = dashboardNumber(status.total);
  const total = Math.max(physical + logical, 1);
  const percent = Math.round(physical / total * 100);
  document.getElementById('daily-category-donut').style.background =
    `conic-gradient(#284566 0 ${percent}%, #c2ccdb ${percent}% 100%)`;
  document.getElementById('daily-category-legend').innerHTML =
    `<div class="legend-row"><span>🟠 물리</span><strong>${dashboardNumber(physical)}</strong></div>` +
    `<div class="legend-row"><span>⚪ 논리</span><strong>${dashboardNumber(logical)}</strong></div>` +
    `<div class="legend-row"><span>IDC / DR</span><strong>${dashboardNumber(location.IDC)} / ${dashboardNumber(location.DR)}</strong></div>`;

  const rows = status.os || [], max = Math.max(...rows.map(r => Number(r.count || 0)), 1);
  document.getElementById('daily-os-bars').innerHTML = rows.length
    ? rows.slice(0, 12).map(r => `<div class="bar-row"><span title="${syncEscape(r.name)}">${syncEscape(r.name)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, Number(r.count || 0) / max * 100)}%"></div></div>
        <strong>${dashboardNumber(r.count)}</strong></div>`).join('')
    : '<div class="text-muted">정상 ITSM 스냅샷이 없습니다.</div>';

  // 기준을 드러낸다. 대수가 ITSM 총 건수와 다를 때 확인할 수 있어야 한다.
  if (typeof renderCountingBasis === 'function') {
    const holder = document.getElementById('daily-counting-basis');
    if (holder) {
      holder.id = 'dash-counting-basis';
      renderCountingBasis(status.counting_basis || null);
      holder.id = 'daily-counting-basis';
    }
  }
}

function renderDailyChanges(key, result) {
  const body = document.getElementById(`daily-${key}-body`);
  const badges = document.getElementById(`daily-${key}-badges`);
  const basis = document.getElementById(`daily-${key}-basis`);
  if (!body) return;

  if (result.error || result.status === 'NO_SNAPSHOT') {
    basis.textContent = result.error || '정상 스냅샷이 없습니다.';
    body.innerHTML = '<tr><td colspan="5" style="text-align:center" class="text-muted">비교 결과 없음</td></tr>';
    badges.innerHTML = '';
    return;
  }
  if (result.status === 'NO_BASELINE') {
    basis.textContent = `최초 정상 수집입니다. 현재 ${Number(result.current?.record_count || 0).toLocaleString()}건이며 다음 수집부터 비교됩니다.`;
    body.innerHTML = '<tr><td colspan="5" style="text-align:center" class="text-muted">비교 기준 없음</td></tr>';
    badges.innerHTML = '';
    return;
  }

  const counts = result.counts || {}, records = result.record_counts || {};
  badges.innerHTML = [['ADDED','신규','badge-green'], ['REMOVED','삭제','badge-red'],
                      ['CHANGED','변경','badge-yellow'], ['STATUS_CHANGED','상태변경','badge-blue']]
    .map(([code, label, cls]) => `<span class="badge ${cls}">${label} ${counts[code] || 0}</span>`).join('')
    // 수집공백은 삭제가 아니다. 통합기 연결이 실패해 못 읽은 것이다. 0 이면 숨긴다.
    + (Number(counts.COLLECTION_GAP || 0)
      ? `<span class="badge badge-yellow" title="통합기 수집이 실패해 못 읽은 자산입니다. 삭제가 아닙니다.">`
        + `수집공백 ${Number(counts.COLLECTION_GAP).toLocaleString()}</span>`
      : '');
  basis.textContent = `${result.previous.snapshot_date} (${Number(records.previous || 0).toLocaleString()}건)`
    + ` → ${result.current.snapshot_date} (${Number(records.current || 0).toLocaleString()}건),`
    + ` 순증감 ${Number(records.net || 0).toLocaleString()}`;

  // 묶음 이벤트(ITSM_ASSET_UPDATED)는 늘 항목별 이벤트와 함께 쌓인다. 둘을 다
  // 그리면 한 자산이 "자산 정보 변경" 한 줄 + 항목별 여러 줄로 나와 중복처럼
  // 보인다. 묶음은 버린다 -- 버려도 잃는 것이 없다.
  const events = (result.events || []).filter(row => row.event_type !== 'ITSM_ASSET_UPDATED');
  const folded = (result.events || []).length - events.length;
  if (folded && basis) basis.textContent += `, 묶음 ${folded}건 접음`;
  body.innerHTML = events.length ? events.map(row => `<tr>
    <td>${syncBadge(row.category || row.event_type)}</td>
    <td><strong>${syncEscape(row.service_name || row.asset_label || row.asset_key)}</strong>
      <div class="text-xs text-muted">${syncEscape([row.hostname, row.primary_ip].filter(Boolean).join(' · ') || row.asset_key)}</div></td>
    <td>${changeField(row)}</td>
    <td>${changeCell(row, 'old')}</td>
    <td>${changeCell(row, 'new')}</td></tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center" class="text-muted">변경 없음</td></tr>';
}

// ── 주간 점검 ──
// 월요일을 주의 시작으로 본다.
let weeklyOffset = 0;

function weekRange(offset) {
  const today = new Date();
  const weekday = (today.getDay() + 6) % 7;          // 월=0 이 되도록 옮긴다
  const monday = new Date(today);
  monday.setDate(today.getDate() - weekday + offset * 7);
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 0);
  return { monday, sunday };
}

function shiftWeek(step) {
  weeklyOffset += step;
  loadWeeklyCheck();
}

function localDate(value) {
  const pad = n => String(n).padStart(2, '0');
  return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}`;
}

async function loadWeeklyCheck() {
  const alertEl = document.getElementById('weekly-alert');
  if (!alertEl) return;
  const { monday, sunday } = weekRange(weeklyOffset);
  document.getElementById('weekly-range').textContent = `${localDate(monday)} ~ ${localDate(sunday)}`;
  alertEl.innerHTML = '<div class="alert alert-info"><span class="loading"></span> 주간 변경 집계 중...</div>';

  const query = new URLSearchParams({
    start: `${localDate(monday)}T00:00:00`,
    end: `${localDate(sunday)}T23:59:59`,
    limit: '10000',
  });
  let rows;
  try {
    // 통계·차트는 원본 이벤트로, 내역표는 서버 단위로 접은 것으로 그린다.
    // 두 번 받는 대신 한 번에 받아 둔다.
    const [raw, folded] = await Promise.all([
      apiFetch('/api/asset-sync/changes?' + query),
      loadChangeDigest(`${localDate(monday)}T00:00:00`, `${localDate(sunday)}T23:59:59`, null, 'period')
        .catch(() => null),
    ]);
    rows = raw;
    weeklyDigest = folded;
  } catch (error) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(error.message)}</div>`;
    return;
  }
  if (rows.error) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(rows.error)}</div>`;
    return;
  }
  alertEl.innerHTML = '';
  renderWeekly(rows, monday);
  showCollectionNotice('weekly-collection-notice');
  loadWeeklyMovements(localDate(monday), localDate(sunday));
}

// 이번 주 자산 생성 · 삭제. 월간 '변동 내역' 과 같은 계산을 주 단위로 돌린다.
let weeklyMovements = null;

async function loadWeeklyMovements(start, end) {
  const holder = document.getElementById('weekly-movement-items');
  if (!holder) return;
  holder.innerHTML = '<div class="text-sm text-muted"><span class="loading"></span> 생성 · 삭제 집계 중...</div>';
  const res = await integrationFetch(`/api/asset-sync/asset-movements?start=${start}&end=${end}`);
  if (res.status !== 'SUCCESS') {
    weeklyMovements = null;
    holder.innerHTML = `<div class="text-sm text-muted">${syncEscape(res.message || res.error || '생성 · 삭제를 불러오지 못했습니다.')}</div>`;
    return;
  }
  weeklyMovements = res.movements;
  const basis = document.getElementById('weekly-movement-basis');
  if (basis) basis.textContent = `비교: ${res.previous_as_of} → ${res.as_of} · 집계 기준 ${(res.basis || {}).label || ''}`;
  renderWeeklyMovements();
}

function traceWeeklyAsset() {
  const { monday, sunday } = weekRange(weeklyOffset);
  runAssetTrace('weekly-trace-q', 'weekly-trace-result', localDate(monday), localDate(sunday));
}

function renderWeeklyMovements() {
  if (!weeklyMovements) return;
  const term = (document.getElementById('weekly-movement-search') || {}).value || '';
  const effect = (document.getElementById('weekly-movement-effect') || {}).value || '';
  renderAssetMovementGroups('weekly-movement-items', weeklyMovements,
    {term, effect, previousLabel: '지난주', transitionSelect: 'weekly-movement-transition'});
}

// 생성·삭제로 세는 이벤트. 나머지는 변경으로 본다.
const WEEKLY_CREATED = ['ITSM_ASSET_CREATED', 'RV_NEW'];
const WEEKLY_REMOVED = ['ITSM_RECORD_REMOVED', 'RV_REMOVED'];

// 숫자만 보고는 무엇이 바뀐 건지 알 수 없다. 화면에 쓴 행을 그대로 들고 있다가
// 아래 내역표에서 다시 쓴다. 다시 받아올 이유가 없다.
let weeklyRows = [];

// 카운트와 같은 기준으로 나눈다. 카드 숫자와 내역 줄 수가 어긋나면 안 된다.
function weeklyBucket(row) {
  if (WEEKLY_CREATED.includes(row.event_type)) return 'created';
  if (WEEKLY_REMOVED.includes(row.event_type)) return 'removed';
  // 묶음 이벤트(ITSM_ASSET_UPDATED)는 항목별 이벤트와 겹치므로 세지 않는다.
  if (row.field_name && row.event_type !== 'ITSM_ASSET_UPDATED') return 'changed';
  return 'other';
}

function filterWeekly(bucket) {
  const select = document.getElementById('weekly-detail-filter');
  if (select) select.value = bucket;
  renderWeeklyDetail();
  const table = document.getElementById('weekly-digest-groups');
  const card = table && table.closest('.card');
  if (card) card.scrollIntoView({behavior: 'smooth', block: 'start'});
}

const WEEKLY_MAX_ROWS = 1000;

// 서버 한 대 = 한 줄. 분류·출처·검색·ITSM 미반영으로 걸러낸다.
// 묶기와 반영 판정은 서버가 한다 -- 화면마다 따로 세면 또 어긋난다.
let weeklyDigest = null;

function renderWeeklyDetail() {
  const table = document.getElementById('weekly-digest-groups');
  const basis = document.getElementById('weekly-detail-basis');
  if (!table) return;
  const rows = (weeklyDigest && weeklyDigest.rows) || [];
  const bucket = document.getElementById('weekly-detail-filter').value;
  const kind = {created: 'CREATED', removed: 'REMOVED', changed: 'CHANGED'}[bucket] || 'all';
  const shown = filterDigestRows(rows, {
    kind,
    source: document.getElementById('weekly-detail-source').value,
    q: document.getElementById('weekly-detail-search').value,
    pending: (document.getElementById('weekly-detail-pending') || {}).checked,
    effect: (document.getElementById('weekly-detail-effect') || {}).value,
  });
  renderChangeDigestGroups('weekly-digest-groups', shown, {kind, empty: '없음'});
  renderDigestPendingNotice('weekly-digest-pending-notice', weeklyDigest,
    {onShow: 'showWeeklyPending()', onExport: 'exportWeeklyPending()'});

  if (basis) {
    const summary = (weeklyDigest && weeklyDigest.summary) || {};
    basis.textContent = rows.length
      ? `서버 ${Number(summary.servers || 0).toLocaleString()}대 · 줄 ${rows.length.toLocaleString()}개`
        + ` (표시 ${shown.length.toLocaleString()})`
        + (summary.itsm_pending ? ` · ITSM 미반영 ${Number(summary.itsm_pending).toLocaleString()}건` : '')
        + (summary.missing_required ? ` · ⚠ 필수 정보 누락 ${Number(summary.missing_required).toLocaleString()}대` : '')
        + digestCountBasis(summary)
        + (summary.trivial_hidden ? ` · 경미 ${Number(summary.trivial_hidden).toLocaleString()}건 숨김` : '')
      : '이 주에 바뀐 서버가 없습니다.';
  }
}

function showWeeklyPending() {
  const box = document.getElementById('weekly-detail-pending');
  const kind = document.getElementById('weekly-detail-filter');
  const source = document.getElementById('weekly-detail-source');
  if (box) box.checked = true;
  if (kind) kind.value = 'all';
  if (source) source.value = '';
  renderWeeklyDetail();
}

async function exportWeeklyDigest(pendingOnly) {
  const alertEl = document.getElementById('weekly-alert');
  const {monday, sunday} = weekRange(weeklyOffset);
  const pending = pendingOnly === undefined
    ? (document.getElementById('weekly-detail-pending') || {}).checked
    : pendingOnly;
  const result = await exportChangeDigest(
    `${localDate(monday)}T00:00:00`, `${localDate(sunday)}T23:59:59`, {pending, fold: 'period'});
  if (!result.ok) {
    alertEl.innerHTML = `<div class="alert alert-error">❌ ${syncEscape(result.error)}</div>`;
  }
}

function exportWeeklyPending() { return exportWeeklyDigest(true); }

function renderWeekly(rows, monday) {
  weeklyRows = rows;
  // 카드 숫자는 아래 묶음 표와 같은 기준(서버 단위 · 운영 대수 기준 생성/삭제)으로
  // 센다. 원본 이벤트 건수로 세면 한 서버가 여러 번 세이고, 미사용 → 운영 같은
  // 상태 변경이 '변경' 으로 빠져 일간을 더한 값과 주간이 어긋난다.
  const digestRows = (weeklyDigest && weeklyDigest.rows) || null;
  let created, removed, changed, net;
  if (digestRows) {
    created = digestRows.filter(r => r.kind === 'CREATED').length;
    removed = digestRows.filter(r => r.kind === 'REMOVED').length;
    changed = digestRows.filter(r => r.kind === 'CHANGED').length;
    net = Number(((weeklyDigest || {}).summary || {}).count_net || 0);
  } else {
    created = rows.filter(r => WEEKLY_CREATED.includes(r.event_type)).length;
    removed = rows.filter(r => WEEKLY_REMOVED.includes(r.event_type)).length;
    changed = rows.filter(r => r.field_name && r.event_type !== 'ITSM_ASSET_UPDATED').length;
    net = created - removed;
  }

  document.getElementById('weekly-created').textContent = created.toLocaleString();
  document.getElementById('weekly-removed').textContent = removed.toLocaleString();
  document.getElementById('weekly-changed').textContent = changed.toLocaleString();
  document.getElementById('weekly-net').textContent = (net > 0 ? '+' : '') + net.toLocaleString();

  const labels = ['월','화','수','목','금','토','일'];
  const byDay = new Array(7).fill(0);
  rows.forEach(row => {
    const detected = new Date(row.detected_at);
    const index = Math.floor((detected - monday) / 86400000);
    if (index >= 0 && index < 7) byDay[index] += 1;
  });
  const maxDay = Math.max(...byDay, 1);
  document.getElementById('weekly-by-day').innerHTML = byDay.map((count, index) =>
    `<div class="bar-row"><span>${labels[index]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, count / maxDay * 100)}%"></div></div>
      <strong>${count.toLocaleString()}</strong></div>`).join('');

  const types = {};
  rows.forEach(row => { types[row.event_type] = (types[row.event_type] || 0) + 1; });
  const sorted = Object.entries(types).sort((a, b) => b[1] - a[1]);
  const maxType = Math.max(...sorted.map(([, n]) => n), 1);
  document.getElementById('weekly-by-type').innerHTML = sorted.length ? sorted.slice(0, 12).map(([name, count]) =>
    `<div class="bar-row"><span title="${syncEscape(name)}">${syncEscape(name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, count / maxType * 100)}%"></div></div>
      <strong>${count.toLocaleString()}</strong></div>`).join('')
    : '<div class="text-muted">이 주에는 변경이 없습니다.</div>';

  // 한 주에 두 번 이상 바뀐 자산. 반복 변경은 확인할 이유가 있다.
  const repeats = {};
  rows.filter(r => r.field_name).forEach(row => {
    const key = `${row.source}|${row.asset_key}`;
    repeats[key] = repeats[key] || { source: row.source, asset: row.asset_key,
      label: row.asset_label || row.asset_key, count: 0, fields: new Set() };
    repeats[key].count += 1;
    repeats[key].fields.add(row.field_label || row.field_name);
  });
  const repeated = Object.values(repeats).filter(item => item.count >= 2)
    .sort((a, b) => b.count - a.count).slice(0, 100);
  document.getElementById('weekly-repeat-body').innerHTML = repeated.length
    ? repeated.map(item => `<tr onclick="searchWeekly('${String(item.asset).replace(/'/g, "\\'")}')" style="cursor:pointer">
        <td>${syncBadge(item.source)}</td>
        <td>${syncEscape(item.label)}<div class="text-xs text-muted mono">${syncEscape(item.asset)}</div></td>
        <td><strong>${item.count}</strong></td>
        <td>${syncEscape([...item.fields].join(', '))}</td></tr>`).join('')
    : '<tr><td colspan="4" style="text-align:center" class="text-muted">두 번 이상 바뀐 자산이 없습니다.</td></tr>';

  renderWeeklyDetail();
}

// 반복 변경된 자산을 눌렀을 때 그 자산의 내역만 남긴다.
function searchWeekly(asset) {
  document.getElementById('weekly-detail-filter').value = 'all';
  document.getElementById('weekly-detail-search').value = asset;
  filterWeekly('all');
}
</script>
