<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월간보고 자동화 시스템 · 로그인</title>
<style>
  /* @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap'); */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fff7ed;
    --surface: #ffffff;
    --border: #fed7aa;
    --accent: #f97316;
    --accent2: #fb923c;
    --text: #3f2d20;
    --text-muted: #9a6b4f;
    --success: #10b981;
    --error: #ef4444;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(249,115,22,0.18) 0%, transparent 70%);
    top: -200px; right: -200px;
    pointer-events: none;
  }
  .bg-glow2 {
    position: fixed;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(251,146,60,0.14) 0%, transparent 70%);
    bottom: -100px; left: -100px;
    pointer-events: none;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px;
    width: 420px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 60px rgba(154,52,18,0.16);
  }
  .logo-area {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 24px;
  }
  .logo-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .logo-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
  }
  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #ea580c);
    border: none;
    border-radius: 10px;
    padding: 15px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:active { transform: scale(0.99); }
  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--error);
    margin-top: 16px;
    display: none;
  }
  .hint {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-icon">📊</div>
    <div class="logo-title">월간보고 자동화 시스템</div>
    <div class="logo-sub">Monthly Report Automation v1.0</div>
  </div>
  <div class="form-group">
    <label>아이디</label>
    <input type="text" id="username" placeholder="아이디를 입력하세요" autocomplete="username">
  </div>
  <div class="form-group">
    <label>비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
  </div>
  <button class="btn-login" onclick="doLogin()">로그인</button>
  <div class="error-msg" id="errMsg"></div>
  <div class="hint">
    운영 배포 전 초기 비밀번호를 변경하세요.<br>
    계정 정보는 관리자에게 문의하세요.
  </div>
</div>
<script>
document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

async function doLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (data.success) {
    window.location.href = '/dashboard';
  } else {
    const el = document.getElementById('errMsg');
    el.textContent = data.message;
    el.style.display = 'block';
  }
}


</script>
</body>
</html>
