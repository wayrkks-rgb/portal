# 사내 GitLab 용 검사. .github/workflows/ci.yml 과 같은 것을 확인한다.
# 둘 중 어디에 push 하든 같은 결과가 나와야 "GitHub 에서는 통과했는데" 같은
# 상황이 생기지 않는다. 한쪽 검사를 늘리면 다른 쪽도 같이 늘린다.

stages:
  - test

variables:
  # 폐쇄망에 사내 PyPI 미러가 있으면 프로젝트 CI/CD 변수로 PIP_INDEX_URL 을
  # 넣는다. 없으면 아래 shell-executor 방식(주석)으로 미리 설치해 둔 venv 를 쓴다.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  key: pip-$CI_COMMIT_REF_SLUG
  paths:
    - .pip-cache

테스트:
  stage: test
  image: python:3.11
  # 같은 branch 에 연달아 push 하면 앞선 실행은 의미가 없다. 취소해 대기열을 비운다.
  interruptible: true
  services:
    # SQLite 로만 돌리면 MySQL 전용 스키마의 문법 오류를 놓친다.
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: ci-password
    MYSQL_DATABASE: portal_ci
    # 서비스 컨테이너는 alias 이름으로 붙는다. GitHub 쪽 127.0.0.1 과 다른 부분.
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_USER: root
    MYSQL_PASSWORD: ci-password
  before_script:
    - python -m pip install --upgrade pip
    # 운영 배포와 같은 조합으로 돌린다. MySQL·BFF 경로도 테스트가 지난다.
    - pip install -r requirements-dev.txt -r requirements-mysql.txt -r requirements-bff.txt
  script:
    - echo "대메뉴 등록 파일 검사"
    - python scripts/check_module_contract.py
    - echo "테스트"
    - python -m pytest -q
    - echo "MySQL 스키마 적용 확인"
    - python scripts/check_module_contract.py --mysql-schema
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Runner 가 docker executor 가 아니거나(폐쇄망에서 흔하다) MySQL 컨테이너를
# 띄울 수 없으면, 위 job 을 지우고 아래를 쓴다. runner 가 설치된 서버에
# 파이썬과 MySQL 을 미리 깔아두고 접속값만 CI/CD 변수로 넣는 방식이다.
#
# 테스트:
#   stage: test
#   tags: [portal-shell]        # shell executor runner 에 붙인 tag
#   before_script:
#     - python -m venv .venv
#     - .venv/bin/pip install -r requirements-dev.txt -r requirements-mysql.txt -r requirements-bff.txt
#   script:
#     - .venv/bin/python scripts/check_module_contract.py
#     - .venv/bin/python -m pytest -q
#     # MySQL 이 없는 runner 면 이 줄은 빼고, 배포 전에 사람이 한 번 돌린다.
#     - .venv/bin/python scripts/check_module_contract.py --mysql-schema
